  Required sections:

  ### Executive Summary
  - best option today
  - top bargain(s)
  - immediate target hits
  - whether to buy now or wait

  ### Best Bargains Found
  Direct links to every recommended listing. Include price, target/average comparison, confidence, and expiry/sale deadline.

  ### New Listings
  Listings not seen in prior cache/report.

  ### Sold Listings
  Sold/completed listings found this run; use them to update true market price.

  ### Sold / Removed Listings From Cache
  Cached listings that disappeared or are marked sold; infer demand and price floors.

  ### Historical Pricing Changes
  Table with item, 7/30/90-day averages where available, prior price, current price, delta, source. Keep all three RTX PRO 6000 Blackwell variants on separate rows; report ambiguous-family samples separately and exclude them from averages.

  ### RTX PRO 6000 Blackwell Variant Comparison
  Compare Workstation Edition, Max-Q Workstation Edition, and Server Edition availability, price, TGP, cooling/deployment requirements, direct compatibility with the current pair, and effective four-GPU total cost.

  ### Compact GB10 Four-Node Acquisition
  Keep NVIDIA DGX Spark and ASUS Ascent GX10 on separate price rows and configuration cohorts. Report available quantity, landed unit price, verified baseline, discount, four-unit total, progress toward four systems, homogeneous-versus-mixed cluster risk, networking/software compatibility, and whether to buy one, buy a lot, or wait.

  ### Supply / Roadmap Changes
  Vendor updates, BIOS/AGESA/firmware, AI workstation announcements, and roadmap depreciation signals.

  ### Marketplace / Refurbisher / Builder Sweep
  Summarize marketplaces, refurbishers, boutique builders, and blocked sources checked.

  ### Enterprise Liquidation Leads
  Auctions/liquidations, source, deadline, lot contents, fees, pickup/shipping constraints, estimated resale/liquidation risk.

  ### Community Intelligence
  Reddit/forum findings on 4-GPU builds, thermals, PCIe lanes, BIOS, PSU, and cases.

  ### PCIe / PSU / Case Findings
  Practical build discoveries and recommendation changes.

  ### Complete Workstation vs Component Cost
