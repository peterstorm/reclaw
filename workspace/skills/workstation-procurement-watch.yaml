  ## Step 15 — Store in cortex

  On Monday runs or any alert, run `/remember`:
  `Workstation procurement {{date}}: best option [A-E], target hits [items/none], top bargains [items/prices], market direction [summary], next trigger [threshold or roadmap event].`

  ## Time budget and coverage honesty

  This skill runs under a 900-second timeout. Exceeding it is not a soft failure:
  the job is killed and re-queued, so a run that overruns is re-paid from the
  start rather than resumed.

  On a FULL SWEEP, treat roughly two-thirds of the budget as the limit for
  Steps 1–10. If you reach it with sources still unvisited, **stop sweeping** and
  proceed to Steps 11–15 with what you have. Do not push on and risk the kill.

  Whatever the mode, the run must state its own coverage. Missing coverage has to
  be visible, because a partial sweep and a complete one otherwise produce
  identical-looking output:

  - Every report and vault note carries a `Coverage:` line naming the mode, the
    number of sources actually visited versus named for that mode, and any source
    skipped for time as distinct from `blocked`.
  - "Skipped for time" and "blocked/unreachable" are different findings and are
    never merged.
  - `ALL_CLEAR` on a TARGETED WATCH day asserts only that the cached watch list and
    the ten price targets were checked. It never implies the wider market was.

  ## Quality guardrails

  Before finalizing:
  - The run mode was decided before Step 0 and the executed steps match it.
  - A coverage statement is present, per "Time budget and coverage honesty".
  - Every recommended listing has a direct URL.
  - Every alert is compared to an explicit target, historical average, or component-build alternative.
  - Historical average calculations state the observed sample used.
  - Current-workstation baseline is used when evaluating Option A.
  - The decision engine does not ignore quiet/reliability/PCIe constraints.
  - Engineering samples are flagged separately as higher-risk.
  - The weekly recommendation is actionable today.
  - Stale, blocked, or sparse data is clearly labeled.
