  Treat community findings as practical risk signals. They can override a nominal bargain if the build path is noisy, unstable, or lane-constrained.

  ## Step 7 — Vendor and firmware monitoring

  Monitor:
  - NVIDIA
  - AMD
  - ASUS
  - ASRock
  - Supermicro
  - Gigabyte
  - SilverStone
  - Phanteks
  - Corsair
  - Seasonic

  Watch for:
  - BIOS releases
  - AGESA updates
  - firmware updates
  - compatibility fixes
  - PCIe bifurcation / lane-topology fixes
  - GPU spacing / 4-GPU compatibility fixes
  - AI workstation announcements
  - quiet workstation chassis/PSU announcements

  Use direct vendor support/news pages where possible. For each meaningful change, record vendor, product, version/date, link, and likely impact on WRX90/EPYC/4× GPU build risk.

  ## Step 8 — Enterprise liquidation monitoring

  Search for organizations selling AI infrastructure or high-end workstation fleets:
  - engineering firms
  - animation studios
  - VFX companies
  - AI startups
  - universities
  - research labs
  - rendering companies

  Watch for:
  - auction listings
  - liquidation sales
  - bankruptcy/administration notices
  - surplus disposal portals
  - lots containing Dell Precision, ThinkStation P-series, HP Z, Supermicro GPU workstations/servers, WRX80/WRX90, EPYC/SP5, RTX A6000/6000 Ada/RTX 6000 PRO systems

  Check auction/liquidation sources where possible:
  - Lauritz / Auktionshuset and Nordic auction houses
  - Troostwijk
  - Surplex
  - Kitmondo
  - Bidspotter
  - EquipNet
  - Hilco
  - GoIndustry DoveBid
  - university surplus portals

  Capture direct links, sale deadlines, lot contents, buyer fees, VAT, shipping/pickup constraints, and resale/liquidation risk.

  ## Step 9 — Roadmap meta-monitor

  Monitor NVIDIA, AMD, and workstation roadmap news. When any of these occur, automatically tighten monitoring and make it prominent:
  - new RTX PRO generation announced
  - new RTX PRO generation starts shipping
  - new Threadripper PRO generation announced or starts shipping
  - new EPYC generation/platform announced or starts shipping
  - major OEM refresh of Dell Precision / ThinkStation / HP Z / Supermicro workstations

  Roadmap-triggered depreciation is a core thesis: previous-generation workstations and CPUs often drop fastest right after successor availability becomes credible. This timing can save tens of thousands of kroner.

  ## Step 10 — PCIe lane / PSU / case analysis

  Track discoveries that affect whether a build can actually support a quiet, reliable 4× RTX 6000 PRO Blackwell setup:

  **PCIe lane discoveries:**
  - CPU lane count and usable slot topology
  - WRX90/EPYC board slot spacing
  - x16/x16/x16/x16 feasibility
  - bifurcation support
  - chipset-lane gotchas
  - mechanical clearance for four dual-slot GPUs
  - NVMe tradeoffs when all GPU slots are populated

  **PSU recommendations:**
  - 4× RTX 6000 PRO power budget plus CPU/platform headroom
  - ATX 3.x / 12V-2x6 support
  - redundant PSU options
  - acoustic profile under sustained 1.5–2.5kW workstation load
  - vendor reliability: Seasonic, Corsair, SilverStone, Supermicro server PSUs

  **Case/chassis recommendations:**
  - quiet thermal design
  - 4× dual-slot / blower GPU support
  - WRX90/SSI-EEB/EEB compatibility
  - front-to-back airflow
  - rack vs tower tradeoffs

  Do not recommend a bargain if the lane/PSU/case path makes it unreliable or noisy unless the caveat is explicit.

  ## Step 11 — Decision engine

  Every Monday, and on any day with a major price-target hit, compare:

  | Option | Meaning |
  |--------|---------|
  | A | Keep current workstation |
  | B | Upgrade to Threadripper PRO |
  | C | Upgrade to EPYC |
  | D | Buy complete workstation |
  | E | Wait |

  Estimate for each option:
  - total upgrade cost
  - performance for local AI / multi-GPU workloads
  - resale value / salvage value
  - future expandability
  - quiet/reliability risk
  - platform risk / BIOS maturity
  - procurement risk
  - total cost of ownership
  - value score

  Use this rubric unless better data is available:
  ```
  Value score =
    (performance_score × 0.25) +
    (expandability_score × 0.20) +
    (price_score × 0.25) +
    (resale_score × 0.10) +
    (quiet_reliability_score × 0.10) +
    (timing_score × 0.10) -
    (risk_penalty × 0.20)
  ```

  Scores are 0–10. Explain the score in plain English. Option A uses the current workstation listed above as the baseline.

  ## Step 12 — Weekly report

  On Mondays, write a full report to:
  `~/dev/notes/remotevault/research/workstation-procurement/{{date}}-W<WEEK>.md`

  Resolve week once first:
  ```
  WEEK=$(date -d '{{date}}' +%V)
  ```

  Frontmatter:
  ```yaml
  ---
  title: "Workstation Procurement Watch — {{date}} W<WEEK>"
  date: {{date}}
  tags: [workstation-procurement, weekly-intel, hardware-market]
  up: "[[research/workstation-procurement/MOC|Workstation Procurement Watch]]"
  ---
  ```

  Required sections:

  ### Executive Summary
  - best option today
  - top bargain(s)
  - immediate target hits
  - whether to buy now or wait

  ### Best Bargains Found
  Direct links to every recommended listing. Include price, target/average comparison, confidence, and expiry/sale deadline.

  ### New Listings
  Listings not seen in prior cache/report.

  ### Sold Listings
  Sold/completed listings found this run; use them to update true market price.

  ### Sold / Removed Listings From Cache
  Cached listings that disappeared or are marked sold; infer demand and price floors.

  ### Historical Pricing Changes
  Table with item, 7/30/90-day averages where available, prior price, current price, delta, source.

  ### Supply / Roadmap Changes
  Vendor updates, BIOS/AGESA/firmware, AI workstation announcements, and roadmap depreciation signals.

  ### Marketplace / Refurbisher / Builder Sweep
  Summarize marketplaces, refurbishers, boutique builders, and blocked sources checked.

  ### Enterprise Liquidation Leads
  Auctions/liquidations, source, deadline, lot contents, fees, pickup/shipping constraints, estimated resale/liquidation risk.

  ### Community Intelligence
  Reddit/forum findings on 4-GPU builds, thermals, PCIe lanes, BIOS, PSU, and cases.

  ### PCIe / PSU / Case Findings
  Practical build discoveries and recommendation changes.

  ### Complete Workstation vs Component Cost
  Compare complete systems against DIY/donor-platform cost.

  ### Decision Engine
  Compare Options A–E with cost/performance/resale/expandability/risk/value score. Recommend one best option.

  ### Recommended Purchases
  Only include items with direct links and rationale. If no purchase is recommended, state exactly what price/event would change the decision.

  ### Waiting Strategy
  What to watch next week and which targets are closest.

  ### Data Quality / Blockers
  Note blocked sites, stale listings, missing sold-price data, and confidence.

  Update or create MOC at:
  `~/dev/notes/remotevault/research/workstation-procurement/MOC.md`

  MOC frontmatter if missing:
  ```yaml
  ---
  title: Workstation Procurement Watch
  date: {{date}}
  tags: [moc, workstation-procurement, hardware-market]
  up: "[[research/MOC|Research]]"
  ---
  ```

  Append today's report link with a one-line decision summary.

  ## Step 13 — Daily alert behavior

  On non-Monday runs:
  - If no threshold is hit, no major roadmap trigger appears, and no unusually asymmetric bargain is found, output exactly `ALL_CLEAR`.
  - If a threshold or major opportunity is found, send a compact Telegram alert and update cache/vault as needed.
  - Do not send a full weekly report on non-Mondays unless the opportunity is time-sensitive and material.

  ## Step 14 — Telegram summary format

  **Daily alert format:**
  ```
  🚨 Workstation price target hit

  [Item] — [price] ([threshold or % below average])
  Source: [seller/source]
  Link: [URL]
  Confidence: [high/medium/low]
  Why it matters: [1-2 lines]
  Recommended action: [buy / verify / wait]
  ```

  **Monday report format:**
  ```
  🖥️ Workstation Procurement Watch — Week WW, YYYY

  Best option: [A/B/C/D/E] — [short rationale]

  Best bargains:
  • [item] — [price] — [why] — [link/status]

  Target hits:
  • [none or item]

  Market direction:
  • Threadripper PRO: ↑/↓/→
  • EPYC: ↑/↓/→
  • Complete workstations: ↑/↓/→
  • RTX 6000 PRO Blackwell: ↑/↓/→

  Recommended strategy:
  [concise buy/wait guidance]

  Full report saved to vault.
  ```

  ## Step 15 — Store in cortex

  On Monday runs or any alert, run `/remember`:
  `Workstation procurement {{date}}: best option [A-E], target hits [items/none], top bargains [items/prices], market direction [summary], next trigger [threshold or roadmap event].`

  ## Quality guardrails

  Before finalizing:
  - Every recommended listing has a direct URL.
  - Every alert is compared to an explicit target, historical average, or component-build alternative.
  - Historical average calculations state the observed sample used.
  - Current-workstation baseline is used when evaluating Option A.
  - The decision engine does not ignore quiet/reliability/PCIe constraints.
  - Engineering samples are flagged separately as higher-risk.
  - The weekly recommendation is actionable today.
  - Stale, blocked, or sparse data is clearly labeled.
