  ## Step 9 — Roadmap meta-monitor (FULL SWEEP / Monday only)

  Monitor NVIDIA, AMD, and workstation roadmap news. When any of these occur, automatically tighten monitoring and make it prominent:
  - new RTX PRO generation announced
  - new RTX PRO generation starts shipping
  - new Threadripper PRO generation announced or starts shipping
  - new EPYC generation/platform announced or starts shipping
  - major OEM refresh of Dell Precision / ThinkStation / HP Z / Supermicro workstations
  - a GB10 compact-system successor or material DGX Spark / ASUS Ascent GX10 refresh is announced or starts shipping

  Roadmap-triggered depreciation is a core thesis: previous-generation workstations and CPUs often drop fastest right after successor availability becomes credible. This timing can save tens of thousands of kroner.

  ## Step 10 — PCIe lane / PSU / case analysis (FULL SWEEP / Monday only)

  Track discoveries that affect whether a build can actually support a quiet, reliable 4× RTX PRO 6000 Blackwell-family setup. Evaluate Workstation, Max-Q Workstation, and Server Edition separately:

  **PCIe lane discoveries:**
  - CPU lane count and usable slot topology
  - WRX90/EPYC board slot spacing
  - x16/x16/x16/x16 feasibility
  - bifurcation support
  - chipset-lane gotchas
  - mechanical clearance for four dual-slot GPUs
  - NVMe tradeoffs when all GPU slots are populated

  **PSU recommendations:**
  - variant-specific four-GPU power budget plus CPU/platform headroom; never apply Max-Q assumptions to Workstation/Server Edition
  - connector count, cable routing, circuit requirements, and transient headroom for the exact GPU variant
  - ATX 3.x / 12V-2x6 support
  - redundant PSU options
  - acoustic profile under sustained 1.5–2.5kW workstation load
  - vendor reliability: Seasonic, Corsair, SilverStone, Supermicro server PSUs

  **Case/chassis recommendations:**
  - quiet thermal design
  - 4× dual-slot / blower GPU support
  - WRX90/SSI-EEB/EEB compatibility
  - front-to-back airflow
  - rack vs tower tradeoffs
  - active-cooling clearance for Workstation/Max-Q versus engineered forced airflow for passive Server Edition

  Workstation Edition is the direct expansion match for the current pair. Max-Q may be a superior whole-fleet quiet/power option, but mixing variants requires explicit analysis of TGP, clocks, thermals, power delivery, and workload behavior. Server Edition is not a quiet-tower drop-in. Do not recommend a bargain if the exact variant's lane/PSU/cooling path makes it unreliable or noisy unless the caveat and remediation cost are explicit.

  **Four-node compact-system analysis:**
  - remaining quantity needed to reach four systems
  - homogeneous four-node DGX Spark versus homogeneous four-node ASUS Ascent GX10 versus mixed-model cluster
  - exact unified memory/storage/networking configuration and software-stack compatibility
  - high-speed interconnect topology, switch/cable cost, and whether advertised multi-node operation is actually supported for the intended workloads
  - aggregate power, acoustics, physical placement, management overhead, warranty region, and landed four-unit total
  - performance/capacity overlap with the current workstation and value versus the WRX90 four-GPU path

  ## Step 11 — Decision engine

  Every Monday, and on any day with a major price-target hit, compare:

  | Option | Meaning |
  |--------|---------|
  | A | Keep current workstation |
  | B | Upgrade to Threadripper PRO |
  | C | Upgrade to EPYC |
  | D | Buy complete workstation |
  | E | Wait |
  | F | Acquire four DGX Spark / ASUS Ascent GX10 compact GB10 systems over time |

  Estimate for each option:
  - total upgrade cost
  - performance for local AI / multi-GPU workloads
  - resale value / salvage value
  - future expandability
  - quiet/reliability risk
  - platform risk / BIOS maturity
  - procurement risk
  - total cost of ownership
  - value score

  Use this rubric unless better data is available:
  ```
  Value score =
    (performance_score × 0.25) +
    (expandability_score × 0.20) +
    (price_score × 0.25) +
    (resale_score × 0.10) +
    (quiet_reliability_score × 0.10) +
    (timing_score × 0.10) -
    (risk_penalty × 0.20)
  ```

  Scores are 0–10. Explain the score in plain English. Option A uses the current workstation listed above as the baseline.

