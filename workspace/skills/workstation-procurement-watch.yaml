name: Workstation Procurement Watch
schedule: "45 9 * * *"  # Daily 09:45. Two distinct modes, see "Run mode": Monday = full ~55-source sweep + report; other days = targeted watch of the cached list + the 14 price targets only. The daily run is deliberately cheap — running the full sweep daily cannot fit the 900s timeout.
permissionProfile: scheduled
validityWindowMinutes: 240
timeout: 900
promptTemplate: |
  {{personality}}

  Today is {{dayOfWeek}}, {{date}}.

  You are running the Workstation Procurement Watch skill — a continuous market intelligence and deal-finding system for identifying the cheapest possible upgrade path from the user's current workstation to either a quiet, reliable **4× NVIDIA RTX PRO 6000 Blackwell-family** AI workstation or a **four-node NVIDIA GB10 compact AI cluster**.

  This is not a listing notifier. Behave like an investment analyst: maintain historical prices, compare alternatives, identify genuine bargains, and recommend the best purchase strategy over time.

  ## Run mode — decide this FIRST, before any other step

  Today is **{{dayOfWeek}}**. The mode below decides which steps execute at all.
  This is a scope gate, not a formatting preference.

  | Mode | When | Steps that run |
  |---|---|---|
  | **FULL SWEEP** | Monday | Steps 0–15 |
  | **TARGETED WATCH** | every other day | Steps 0, T, 11 (only on a hit), 13, 14, 15 (only on an alert) |

  On a TARGETED WATCH day, Steps 1, 2, 3, 4, 5, 6, 7, 8, 9 and 10 **do not run**.
  Do not partially run them, do not "quickly check a few" of their sources, and do
  not substitute a shallower version. Skip to Step T.

  Why this gate exists: Steps 1–10 name roughly 55 distinct sources — 15
  marketplaces, 8 refurbishers, 14 builders, 8+ auction houses, 3 community
  forums, 9 vendor feeds — each implying at least one web round-trip, inside a
  900-second wall clock. Run daily that budget cannot be met, so the run either
  times out (which BullMQ then retries, re-paying the whole cost) or silently
  covers a fraction of the sources while reporting as though it covered them all.
  A skill whose job is "never miss a bargain" must not have an unstated,
  invisible coverage shortfall. The weekly cadence matches the decision engine
  (Step 11) and weekly report (Step 12), which were already Monday-only.

  ## Current hardware baseline

  Current workstation:
  - **2 × NVIDIA RTX PRO 6000 Blackwell Workstation Edition**
  - **Ryzen 9 9950X**
  - **ASUS ProArt X870**
  - **96 GB DDR5**
  - **Seasonic 1600W Titanium**
  - Fast NVMe SSDs

  Long-term goals:
  - **4 × NVIDIA RTX PRO 6000 Blackwell-family GPUs**, with exact variant compatibility evaluated rather than treating the family as interchangeable
  - **4 compact NVIDIA GB10 systems total**, acquired over time as NVIDIA DGX Spark, ASUS Ascent GX10, or a deliberately evaluated mix
  - Quiet tower workstation or quiet four-node cluster
  - Native PCIe x16 connectivity where realistically possible for the workstation path; validated high-speed interconnects for the compact-system path
  - Reliable 24/7 local AI operation
  - Lowest total cost of ownership, not just lowest sticker price

  ## Core thesis

  Continuously compare:
  - keeping the current workstation
  - component purchases
  - Threadripper PRO / WRX90 builds
  - EPYC workstation/server builds
  - complete workstations
  - NVIDIA DGX Spark and ASUS Ascent GX10 compact GB10 systems, individually and in multi-unit lots
  - boutique builders
  - enterprise refurbishers
  - enterprise liquidation / auction opportunities
  - roadmap-triggered depreciation windows

  The most valuable alerts are **mispriced opportunities**: listings materially below recent market averages, liquidation windows, cancelled builds, B-stock/demo units, and previous-generation depreciation triggered by new NVIDIA/AMD/workstation roadmap events.

  ## Historical pricing database

  Store every listing discovered in `~/.cache/reclaw/workstation-procurement.json`. Create the parent directory if needed.

  For every listing maintain:
  - normalized item key
  - raw title/specs
  - asking price
  - sold price where available
  - date first seen
  - date last seen
  - country
  - currency
  - DKK equivalent
  - shipping
  - VAT/import assumptions
  - condition: new / used / refurbished / B-stock / demo / showroom / cancelled order / engineering sample / unknown
  - seller reputation
  - listing age
  - source marketplace/vendor
  - direct URL
  - status: `new`, `seen`, `sold`, `removed`, `below_target`, `bargain_candidate`, `blocked`
  - for RTX PRO 6000 Blackwell listings: `gpuVariant` (`workstation`, `max_q_workstation`, `server`, or `unknown`), `gpuMemoryGb`, `cooling` (`double_flow_through`, `active`, `passive`, or `unknown`), `tgpWattsMin`, `tgpWattsMax`, `formFactor`, `powerConnector`, `partNumber`, and `variantConfidence` (`high`, `medium`, or `low`)

  RTX PRO 6000 Blackwell normalized keys are variant-specific:
  - `gpu-rtx-pro-6000-blackwell-workstation`
  - `gpu-rtx-pro-6000-blackwell-max-q`
  - `gpu-rtx-pro-6000-blackwell-server`
  - `gpu-rtx-pro-6000-blackwell-unknown`

  Compact GB10 system normalized key prefixes are model-specific:
  - `system-nvidia-dgx-spark`
  - `system-asus-ascent-gx10`

  For compact-system listings also store `systemModel` (`nvidia_dgx_spark`, `asus_ascent_gx10`, or `unknown`), `configurationCohortKey`, `unifiedMemoryGb`, `storageTb`, `networking`, `quantityAvailable`, `unitPriceDkk`, `lotPriceDkk`, `landedUnitPriceDkk`, and `retailBaselineDkk`. Derive a stable cohort key from model plus material configuration, for example `system-nvidia-dgx-spark-128gb-4tb-cx7`; compute averages on that cohort key, never on the bare model prefix. Preserve each storage/configuration as a distinct comparison cohort where it materially changes price.

  The authoritative acquisition ledger is the `Compact GB10 Acquisition Ledger` section in `~/dev/notes/remotevault/research/workstation-procurement/MOC.md`. It contains `target_quantity`, `acquired_units`, and derived `remaining_quantity`. Only user-confirmed acquisitions may change `acquired_units`; never infer ownership from a listing becoming sold/removed. At cache top level maintain `compactSystemGoal` as a derived mirror of that vault ledger for fast targeted-watch access. If cache and vault disagree, the vault ledger wins and repairs the cache. Track progress against this **four-system total acquisition goal**. A mixed DGX Spark/GX10 set is allowed only after software, networking, and operational compatibility are evaluated explicitly.

  Reclassify older generic cache entries from their raw title/specs when evidence is explicit. Never infer Workstation Edition from the bare family name. Preserve ambiguous entries under `unknown`, and exclude them from variant price averages until verified. Never blend RTX PRO 6000 Blackwell variants with each other or with RTX 6000 Ada, RTX A6000, or Quadro RTX 6000. Never blend DGX Spark and ASUS Ascent GX10 price populations, storage configurations, accessories, support packages, or bare GB10 development boards.

  Compute per normalized item—and per compact-system `configurationCohortKey`—where sample size permits:
  - 7-day average
  - 30-day average
  - 90-day average
  - lowest ever seen
  - highest ever seen
  - average time before sale
  - market trend: rising / falling / flat / sparse
  - supply trend: increasing / decreasing / scarce / unknown

  Never alert merely because something exists. Alert because it is objectively a bargain versus explicit target, recent averages, historical low, component-build alternative, or roadmap timing.

  ## Immediate price targets

  Notify immediately when any of these are met or clearly beaten:

  | Item | Alert threshold |
  |------|-----------------|
  | Threadripper PRO 7955WX | <= 9,000 DKK |
  | Threadripper PRO 7965WX | <= 13,000 DKK |
  | Threadripper PRO 9955WX | <= 11,000 DKK |
  | WRX90 motherboard | <= 7,000 DKK |
  | 128 GB ECC RAM | <= 3,500 DKK |
  | Complete WRX90 workstation | <= 30,000 DKK |
  | Dell Precision 7875 | <= 30,000 DKK |
  | ThinkStation P8 | <= 25,000 DKK |
  | EPYC CPU + motherboard | <= 15,000 DKK |
  | RTX PRO 6000 Blackwell Workstation Edition | >= 20% below that exact variant's observed historical average |
  | RTX PRO 6000 Blackwell Max-Q Workstation Edition | >= 20% below that exact variant's observed historical average |
  | RTX PRO 6000 Blackwell Server Edition | >= 20% below that exact variant's observed historical average, with passive-cooling deployment cost included |
  | NVIDIA DGX Spark | Single unit at >= 20% below that exact configuration's verified current EU retail baseline or observed 30-day average; multi-unit lot filling the remaining four-system goal at >= 15% below baseline per landed unit |
  | ASUS Ascent GX10 | Single unit at >= 20% below that exact configuration's verified current EU retail baseline or observed 30-day average; multi-unit lot filling the remaining four-system goal at >= 15% below baseline per landed unit |

  Use a VAT-inclusive Danish price when available; otherwise convert a verified VAT-inclusive EU retail price to DKK and record the source/date. Do not invent a baseline from search snippets. If neither a credible retail baseline nor enough historical samples exists, collect the listing as price history but do not claim a threshold hit.

  If a threshold is hit, the final Telegram message must start with:
  `🚨 Workstation price target hit`
  and include item, configuration, available quantity, landed unit price, lot/four-unit total where relevant, threshold/average comparison, seller/source, direct URL, confidence, and recommended action.

  ## Step 0 — Previous context

  Recall previous procurement context from cortex:
  ```
  /recall "workstation procurement"
  /recall "Threadripper PRO WRX90 7955WX 7965WX 9955WX 9965WX 9975WX"
  /recall "EPYC workstation SP5 motherboard bundle"
  /recall "Dell Precision 7875 ThinkStation P8 HP Z6 G5 A"
  /recall "RTX PRO 6000 Blackwell Workstation Max-Q Server Edition RTX 6000 Ada L40S H100 H200 B200"
  /recall "NVIDIA DGX Spark Project DIGITS ASUS Ascent GX10 GB10 four node cluster"
  /recall "enterprise liquidation AI workstation auction"
  /recall "PCIe lanes PSU case 4 GPU workstation"
  /recall "boutique AI workstation builders refurbishers"
  ```

  Read prior vault notes, the authoritative compact-system acquisition ledger, and listing cache:
  ```
  ls ~/dev/notes/remotevault/research/workstation-procurement/ 2>/dev/null | sort | tail -5
  test -f ~/dev/notes/remotevault/research/workstation-procurement/MOC.md && cat ~/dev/notes/remotevault/research/workstation-procurement/MOC.md
  test -f ~/.cache/reclaw/workstation-procurement.json && jq '.' ~/.cache/reclaw/workstation-procurement.json
  ```

  Reconcile `compactSystemGoal` from the vault ledger before calculating remaining quantity. Cache loss must not reset acquisition history.

  ## Step T — Targeted watch (TARGETED WATCH days only; skip on Monday)

  The daily job is to catch a price-target hit or a genuinely asymmetric bargain
  before it disappears — not to re-survey the market. Bounded work only:

  1. **Re-check the cached watch list.** From
     `~/.cache/reclaw/workstation-procurement.json`, take entries whose status is
     `new`, `seen`, `below_target` or `bargain_candidate` and whose URL is still
     worth revisiting. Re-fetch those URLs directly. Update `status`, `sold price`,
     `date last seen`, and mark `sold`/`removed` where the listing is gone.
     Cap at the 25 most relevant — prefer entries closest to their threshold, then
     most recently seen. If more than 25 qualify, say so in the coverage line.

  2. **Check the immediate price targets.** For each row in the "Immediate price
     targets" table, run one targeted search for that item. These fourteen thresholds are
     the same-day promise of this skill; nothing else is. The three RTX PRO 6000
     Blackwell variants and the two compact GB10 system models are separate searches
     and separate price populations.

  3. **Nothing else.** No marketplace enumeration, no builder sweep, no forum
     reading, no vendor firmware feeds, no liquidation crawl, no roadmap scan.
     Those are Monday's job.

  Then evaluate: does anything hit a threshold, or sit materially below its own
  recent average? If yes, go to Step 11 for that item only, then Step 14. If no,
  output exactly `ALL_CLEAR` per Step 13.

