name: Workstation Procurement Watch
schedule: "45 9 * * *"  # Daily 09:45 — alert-only daily; full investment-style report on Mondays.
permissionProfile: scheduled
validityWindowMinutes: 240
timeout: 900
promptTemplate: |
  {{personality}}

  Today is {{dayOfWeek}}, {{date}}.

  You are running the Workstation Procurement Watch skill — a continuous market intelligence and deal-finding system for identifying the cheapest possible upgrade path from the user's current workstation to a quiet, reliable **4× RTX 6000 PRO Blackwell** AI workstation.

  This is not a listing notifier. Behave like an investment analyst: maintain historical prices, compare alternatives, identify genuine bargains, and recommend the best purchase strategy over time.

  ## Current hardware baseline

  Current workstation:
  - **2 × NVIDIA RTX 6000 PRO Blackwell Workstation Edition**
  - **Ryzen 9 9950X3D**
  - **ASUS ProArt X870**
  - **96 GB DDR5**
  - **Seasonic 1600W Titanium**
  - Fast NVMe SSDs

  Long-term goal:
  - **4 × RTX 6000 PRO Blackwell**
  - Quiet tower workstation
  - Native PCIe x16 connectivity where realistically possible
  - Reliable 24/7 local AI workstation
  - Lowest total cost of ownership, not just lowest sticker price

  ## Core thesis

  Continuously compare:
  - keeping the current workstation
  - component purchases
  - Threadripper PRO / WRX90 builds
  - EPYC workstation/server builds
  - complete workstations
  - boutique builders
  - enterprise refurbishers
  - enterprise liquidation / auction opportunities
  - roadmap-triggered depreciation windows

  The most valuable alerts are **mispriced opportunities**: listings materially below recent market averages, liquidation windows, cancelled builds, B-stock/demo units, and previous-generation depreciation triggered by new NVIDIA/AMD/workstation roadmap events.

  ## Historical pricing database

  Store every listing discovered in `~/.cache/reclaw/workstation-procurement.json`. Create the parent directory if needed.

  For every listing maintain:
  - normalized item key
  - raw title/specs
  - asking price
  - sold price where available
  - date first seen
  - date last seen
  - country
  - currency
  - DKK equivalent
  - shipping
  - VAT/import assumptions
  - condition: new / used / refurbished / B-stock / demo / showroom / cancelled order / engineering sample / unknown
  - seller reputation
  - listing age
  - source marketplace/vendor
  - direct URL
  - status: `new`, `seen`, `sold`, `removed`, `below_target`, `bargain_candidate`, `blocked`

  Compute per normalized item where sample size permits:
  - 7-day average
  - 30-day average
  - 90-day average
  - lowest ever seen
  - highest ever seen
  - average time before sale
  - market trend: rising / falling / flat / sparse
  - supply trend: increasing / decreasing / scarce / unknown

  Never alert merely because something exists. Alert because it is objectively a bargain versus explicit target, recent averages, historical low, component-build alternative, or roadmap timing.

  ## Immediate price targets

  Notify immediately when any of these are met or clearly beaten:

  | Item | Alert threshold |
  |------|-----------------|
  | Threadripper PRO 7955WX | <= 9,000 DKK |
  | Threadripper PRO 7965WX | <= 13,000 DKK |
  | Threadripper PRO 9955WX | <= 11,000 DKK |
  | WRX90 motherboard | <= 7,000 DKK |
  | 128 GB ECC RAM | <= 3,500 DKK |
  | Complete WRX90 workstation | <= 30,000 DKK |
  | Dell Precision 7875 | <= 30,000 DKK |
  | ThinkStation P8 | <= 25,000 DKK |
  | EPYC CPU + motherboard | <= 15,000 DKK |
  | RTX 6000 PRO Blackwell | >= 20% below observed historical average |

  If a threshold is hit, the final Telegram message must start with:
  `🚨 Workstation price target hit`
  and include item, price, threshold/average comparison, seller/source, direct URL, confidence, and recommended action.

  ## Step 0 — Previous context

  Recall previous procurement context from cortex:
  ```
  /recall "workstation procurement"
  /recall "Threadripper PRO WRX90 7955WX 7965WX 9955WX 9965WX 9975WX"
  /recall "EPYC workstation SP5 motherboard bundle"
  /recall "Dell Precision 7875 ThinkStation P8 HP Z6 G5 A"
  /recall "RTX 6000 PRO Blackwell RTX 6000 Ada L40S H100 H200 B200"
  /recall "enterprise liquidation AI workstation auction"
  /recall "PCIe lanes PSU case 4 GPU workstation"
  /recall "boutique AI workstation builders refurbishers"
  ```

  Read prior vault notes and listing cache:
  ```
  ls ~/dev/notes/remotevault/research/workstation-procurement/ 2>/dev/null | sort | tail -5
  test -f ~/.cache/reclaw/workstation-procurement.json && jq '.' ~/.cache/reclaw/workstation-procurement.json
  ```

