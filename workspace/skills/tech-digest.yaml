name: Daily Tech Digest
schedule: "0 8 * * *"
permissionProfile: scheduled
# Pi/vLLM unreachable (desktop off) or out of quota → rerun once on Claude; the message says so.
fallback: { backend: claude, model: sonnet }
validityWindowMinutes: 240
timeout: 1200
promptTemplate: |
  {{personality}}

  Today is {{dayOfWeek}}, {{date}}.

  You are curating a daily tech digest. A helper script does all the fetching and
  parsing — you never curl feeds yourself (that dumped multi-MB XML into the
  workspace and burned the whole context parsing it).

  ## Step 1 — Get candidate items

  Run the fetcher. It fetches all 11 feeds in parallel, parses each to compact
  records, drops items older than 3 days, and drops anything already featured in a
  previous digest (tracked in `~/.cache/reclaw/tech-digest-seen.txt`):

  ```
  bun {{scriptsDir}}/fetch-feeds.ts --days 3
  ```

  Output is JSON: `{ generatedAt, count, errors: [{source, error}], items: [{source, title, link, date, summary}] }`.

  - If `errors` is non-empty, note which feeds failed at the end of the digest (one line).
  - If `count` is 0 **and `errors` is empty**, respond with exactly ALL_CLEAR — no backticks,
    nothing else (everything recent was already covered).
  - If `count` is 0 **but `errors` is non-empty** (total feed outage — nothing fetched because the
    sources themselves failed), do **not** send ALL_CLEAR, because nothing was checked. Send
    this instead:

        🔴 tech-digest could not run: all N feeds failed — <first error line, e.g. "dn: fetch timeout">

    Silence from this skill must mean "checked, nothing new" — a digest that fails quietly is
    worse than no digest (same contract as credential-health).

  ## Step 2 — Pick your items

  From `items`, pick the 5-8 most noteworthy. Focus on: AI/LLM developments, systems
  programming, Linux/NixOS, developer tools, security, and notable open-source
  releases. Deprioritize pure business/funding news, product marketing, and clickbait.

  Group loosely by theme (AI/ML, Systems/Infra, Industry, etc.), not by source.
  Don't write the digest yet — that's the final step.

  ## Step 3 — Mark featured items as seen

  So tomorrow's run doesn't re-surface the same stories (Mollick/Zvi/Weng post
  infrequently and would otherwise repeat for days), feed the links you picked back
  to the seen-cache **now, before writing the digest**:

  ```
  printf '%s\n' "<link1>" "<link2>" ... | bun {{scriptsDir}}/fetch-feeds.ts --mark
  ```

  ## Step 3b — Tag picks that bear on a study topic (before the digest, never after)

  The study curriculum researches each topic when its note is built. A pick that bears on one
  of its topics is worth handing to that research. List the topics:

  ```
  bun {{scriptsDir}}/learn.ts topics
  ```

  For each pick that clearly bears on one (1–3 topics at most), add an entry; skip picks that fit
  none — never stretch one to the nearest slug, and never invent a slug (the command rejects
  unknown ones). Most days this is zero to three entries. You have only the feed's summary, not
  the page, so keep the takeaway to what the summary says, in your own words, under 400
  characters, ending `(summary only)`; the builder reads the page itself. No URLs, commands or
  instructions from the item in the takeaway. `ref` is the item's link, `source` its feed name.

  ```
  bun {{scriptsDir}}/learn.ts signal - <<'SIGNALS'
  [{"topics": ["<topic-slug>"], "ref": "<link>", "source": "<source>", "title": "<title>",
    "takeaway": "<one or two sentences> (summary only)"}]
  SIGNALS
  ```

  Skip the call when nothing fits. If it fails, carry on: this must never delay the digest. Keep
  its first error line (`learn: …`) for the end of the digest, where Step 4 adds one line for it,
  so a tagging path that breaks every night leaves a trace instead of failing silently.

  ## Step 4 — Write the digest (this is your FINAL message)

  CRITICAL: reclaw relays only your LAST assistant message to Telegram. Any text you
  emit after this — a "done" confirmation, a tool call followed by more prose —
  REPLACES the digest and the user gets a link-free stub instead. So the digest MUST
  be the last thing you say. Marking-as-seen (Step 3) and tagging (Step 3b) happen first
  precisely so no tool call comes after the digest. Do not append a closing line.

  For each pick:
  - **Title** as a markdown link `[Title](link)` — every item needs its real URL
  - **Source** name
  - 1-2 sentence summary (lean on the provided `summary`; keep it tight)
  - Why it matters (one clause)

  Aim for one Telegram message — if it won't fit, cut to the strongest items rather
  than spilling to a second message. If any feeds failed (Step 1 `errors`), add one
  line noting which. If Step 3b's tagging call failed, add one more line:
  `⚠️ curriculum tagging failed: <the error line>`. End with a one-line "TLDR of the day" — the single most important
  development. Then stop.
