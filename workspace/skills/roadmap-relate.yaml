name: Roadmap Relate
# Nightly. Most nights the plan says nothing-to-do and the run ends at once (ALL_CLEAR).
# Work happens when new @bashi_fuirkashi reels were ingested (folded 40 per night, oldest first),
# when the roadmap note changed, or when a repo moved and the last mapping is a week old.
schedule: "0 22 * * *"
permissionProfile: scheduled
# Pi/vLLM unreachable (desktop off) or out of quota → rerun once on Claude; the message says so.
fallback: { backend: claude, model: sonnet }
validityWindowMinutes: 240
timeout: 3600
promptTemplate: |
  {{personality}}

  Today is {{dayOfWeek}}, {{date}}.

  You keep the bashi_fuirkashi AI-engineering roadmap note current and relate it to the user's
  own repos. This is an automated scheduled job: no user is present, ask nothing, never pause.

  A helper does all bookkeeping — which reels are new, whether the repos moved, what was
  already done. Never track that yourself and never edit its state file.

  ## Step 1 — Plan

  ```
  bun {{scriptsDir}}/roadmap-relate.ts plan
  ```

  Output JSON: `plan` (`{kind: "nothing-to-do"}` or `{kind: "work", fold: [{shortCode, postedAt}],
  pendingAfter, remap: null | {kind: "never-mapped" | "roadmap-changed" | "repos-moved", repos?}}`),
  `repos` (`name, path, what, ref, sha, committedAt, fetchError`), `roadmapNote`, `mappingNote`,
  `reelsDir`.

  If `plan.kind` is `nothing-to-do`, reply with exactly ALL_CLEAR — nothing else — and stop.

  ## Step 2 — Fold new reels (only if `plan.fold` is non-empty)

  The roadmap was written from captions. Reels add what captions don't: the spoken transcript,
  text on screen, text in images. Get exactly that for this batch:

  ```
  bun {{scriptsDir}}/roadmap-relate.ts digest <shortCode> <shortCode> …   # all of plan.fold
  ```

  Read the roadmap note (`roadmapNote`) in full, including the section between
  `<!-- roadmap-relate:reels:start -->` and `<!-- roadmap-relate:reels:end -->` — that section is
  yours; everything else in the note is hand-curated and you must not change it.

  Decide what in this batch is **substantive and not already in the note**: a concrete technique,
  definition, metric, architecture, project spec, resource (book/course/paper/repo — URLs only if
  they appear verbatim), interview question or job-search tactic. Most reels are hooks and calls
  to action ("comment X"); skip those. OCR text is noisy (`Iearn` = learn, `Al` = AI): use it for
  what it clearly says, never quote garbled strings. Never invent; when unsure, leave it out.

  Write the **whole new section body** (the existing section's content merged with this batch's
  findings, deduplicated, grouped under the same headings the note uses: RAG and retrieval;
  Knowledge architecture; Agents and orchestration; AI-assisted development; LLMOps, evaluation
  and deployment; Cost, latency and caching; Safety; ML foundations; Projects; Resources;
  Interview; Job search) to a temp file, then install it:

  ```
  bun {{scriptsDir}}/roadmap-relate.ts set-section /tmp/roadmap-reels-section.md
  ```

  Section format: start with `## From the reels — transcripts and on-screen text` and one line
  `_Maintained by the roadmap-relate skill; last folded {{date}}; N reels read so far._`; cite
  every item with its reel as `[[media/instagram/bashi_fuirkashi/<code>|<code>]]`. Then record
  the batch — all of `plan.fold`, including reels that added nothing:

  ```
  bun {{scriptsDir}}/roadmap-relate.ts mark-folded <shortCode> <shortCode> …
  ```

  ## Step 3 — Map the roadmap onto our repos (only if `plan.remap` is not null)

  Read the roadmap note again (it may have just changed) and the current mapping note
  (`mappingNote`) if it exists — you will report what changed against it.

  For each roadmap theme, find out what each repo in `repos` actually has **at its default
  branch** — `ref` (e.g. `origin/main`), commit `sha`. Read code with git against that ref only:

  ```
  git -C <path> grep -n -I -i -E '<pattern>' <ref> -- ':!*.lock' ':!*.svg' | head -40
  git -C <path> show <ref>:<file>
  git -C <path> ls-tree -r --name-only <ref> | grep -i <term>
  git -C <path> log --oneline -15 <ref>
  ```

  NEVER run checkout, switch, stash, reset, pull, commit or any write in these repos — other
  sessions are working in them. Also read each repo's README / CONTEXT.md / docs at `<ref>`.
  A repo with `sha: null` could not be read: mark its column "not read" and say why.

  Judge each item as **✅ have** (implemented and used), **🟡 partial** (exists but not the
  production form the roadmap describes — say what's missing) or **❌ missing**, with evidence:
  a `repo:path` (and symbol) for every ✅/🟡. No evidence → not ✅. Don't count docs, plans or
  TODOs as implementation. Cover at least: hybrid retrieval & reranking, relevance thresholds /
  dynamic K, citation verification, retrieval eval metrics, doc lifecycle/versioning, knowledge
  graph, CAG / caching tiers, semantic cache, agent patterns (ReAct, planning, reflection,
  routing, multi-agent), graph/state orchestration, HITL, tool permissions & budgets/loop
  limits, MCP, eval harness & LLM-as-judge, evals in CI / regression gates, tracing &
  observability, prompt/dataset versioning, staged rollout, gateway/fallback/routing, cost
  tracking, rate limits/queues, prompt-injection & red-teaming, PII/DLP, structured outputs,
  serving/inference, fine-tuning, AI-assisted development (coding agents, specs).

  Write the mapping note with the Write tool (it is fully generated each time — overwrite it):

  ```
  ---
  title: "bashi_fuirkashi roadmap vs our repos"
  date: <first mapping date, keep it from the existing note>
  updated: {{date}}
  tags: [ai-engineering, roadmap, gap-analysis, portfolio, generated]
  aliases: [roadmap vs repos]
  up: "[[programming/ai/MOC|AI Engineering]]"
  source: "[[programming/ai/bashi-fuirkashi-ai-engineering-roadmap|bashi_fuirkashi roadmap]]"
  ---
  # bashi_fuirkashi roadmap vs our repos

  _Generated by the roadmap-relate skill on {{date}} from each repo's default branch. Re-run
  automatically when the roadmap changes or weekly when repos move. Hand edits are overwritten._

  ## As of
  | Repo | What | Ref | Commit | Committed |   (+ fetch errors, if any)

  ## Changes since the last mapping
  (items whose status changed, with the commit/area that changed it; "first mapping" if none)

  ## Matrix
  One table per roadmap theme: | Item | loom | fugue | reclaw | chatbot | cortex | — cells are
  status + evidence path, short.

  ## Strongest proof points
  The 5–8 items where a repo is already portfolio-grade, with where to look.

  ## Biggest gaps → next builds
  The 3–5 highest-value ❌/🟡 items, each with the repo it best fits and the smallest credible
  slice to close it. Link [[programming/ai/ai-engineering-gap-analysis-chatbot-fugue-loom-cortex]]
  for the earlier hand-written analysis where relevant.
  ```

  Then record the mapping:

  ```
  bun {{scriptsDir}}/roadmap-relate.ts mark-mapped
  ```

  ## Step 4 — Final message (this is the ONLY message the user sees)

  Short, self-contained, no preamble:
  - folded: N reels read (M with something new), `pendingAfter` still queued — the 2–4 most
    useful new items in one line each;
  - mapped (if it ran): why (first mapping / roadmap changed / which repos moved), the status
    changes since last time, and the top 2–3 gaps;
  - links: [[programming/ai/bashi-fuirkashi-ai-engineering-roadmap]] and
    [[programming/ai/bashi-roadmap-vs-our-repos]];
  - any repo that could not be fetched or read, and any step that failed (with the error).
  If a step failed, do not run its mark command — the next run retries it.
