name: Cortex Prune
schedule: "0 0 * * *"
permissionProfile: scheduled
validityWindowMinutes: 60
timeout: 300
promptTemplate: |
  {{personality}}

  Time: {{dayOfWeek}}, {{date}}

  You are running nightly cortex memory maintenance. Prune stale, redundant, or low-value memories to keep the store lean and high-signal.

  CRITICAL: This is an automated scheduled job. There is NO user present to respond. Do NOT output questions, confirmation requests, or tables asking for approval. Do NOT invoke /prune or any skill — follow ONLY the inline steps below. Execute all steps immediately and silently.

  ## Step 1: Fetch all active memories

  Query both project and global databases:

  ```bash
  bun -e "
  import Database from 'bun:sqlite';
  const db = new Database('{{cwd}}/.memory/cortex.db', { readonly: true });
  // Fresh skill-quality signals (<7d) are excluded from the evaluation set:
  // the skill-quality-monitor needs them, so they must NOT be offered to LLM
  // judgment. This enforces the Step 2a \"always keep\" rule in code.
  const cutoff7 = new Date(Date.now() - 7*24*60*60*1000).toISOString();
  const rows = db.query(\"SELECT id, memory_type, summary, confidence, access_count, pinned, created_at FROM memories WHERE status = 'active' AND NOT (tags LIKE '%\\\"skill-quality\\\"%' AND created_at >= ?) ORDER BY memory_type, created_at\").all(cutoff7);
  for (const r of rows) {
    console.log(r.memory_type + ' | ' + r.id.slice(0,8) + ' | conf=' + r.confidence + ' acc=' + r.access_count + (r.pinned ? ' PIN' : '') + ' | ' + r.summary.slice(0,140));
  }
  console.log('Total:', rows.length);
  db.close();
  "
  ```

  Also check global DB at `~/.claude/memory/cortex-global.db` with the same query.

  ## Step 2: Evaluate each memory

  For each memory, decide **keep** or **archive**:

  **ARCHIVE if:**
  - Redundant: another active memory covers the same information
  - Stale: refers to resolved issues, old session context, or completed tasks
  - Too granular: implementation details better found by reading code
  - Session-specific: one-time observations that won't help future sessions
  - Generic: general best practices the LLM already knows
  - Superseded: a newer memory covers this with updated info
  - Meta: memories about the pruning process itself

  **KEEP if:**
  - Pinned (never archive pinned memories) — except `skill-quality` carve-out below
  - Actionable: describes a pattern, gotcha, or decision affecting future work
  - Structural: describes where things live or how systems connect (one per concept)
  - High access count: frequently accessed = clearly useful
  - Unique: no other memory covers this information

  ### Step 2a: `skill-quality` carve-out (overrides pin)

  Memories tagged `skill-quality` are operational signals consumed by the
  `skill-quality-monitor`, which only reads the last 7 days. Beyond that
  window they're pure noise. Override the standard rules for these:

  - **Always archive** `skill-quality`-tagged memories whose `created_at` is
    older than 7 days from today, **regardless of pin status**. Use the SQL
    query below to identify them; do not apply LLM judgment per-entry.
  - **Always keep** `skill-quality`-tagged memories from the last 7 days,
    regardless of LLM judgment about granularity or redundancy — the monitor
    needs the full set in its window. This is enforced in code, not by you:
    Step 1's fetch already excludes fresh `skill-quality` memories from the
    set you evaluate, and Step 3's archive `UPDATE` refuses to touch them as a
    final guard. Do not attempt to archive any `skill-quality` memory from the
    last 7 days even if it looks like a one-time observation — it is by design.

  ```bash
  bun -e "
  import Database from 'bun:sqlite';
  const db = new Database('{{cwd}}/.memory/cortex.db', { readonly: true });
  const cutoff = new Date(Date.now() - 7*24*60*60*1000).toISOString();
  // Match the exact \"skill-quality\" tag, not substrings like \"skill-quality-monitor\".
  const rows = db.query(\"SELECT id FROM memories WHERE status='active' AND tags LIKE '%\\\"skill-quality\\\"%' AND created_at < ?\").all(cutoff);
  console.log(JSON.stringify(rows.map(r=>r.id)));
  db.close();
  "
  ```

  Add the returned IDs to the Step 3 archive batch.

  ## Step 2.5: Code-drift check (selective)

  For memories that reference code, verify the named symbols still exist in the source. A memory is **code-coupled** if its `summary` or `content` contains:

  - A file path (e.g. `src/foo/bar.ts`, `roles/reclaw/default.nix`)
  - A function or class name in code-style (`camelCase`, `PascalCase`, `snake_case` referring to identifiers — not English nouns)
  - An env var (`UPPER_SNAKE_CASE`)
  - A version string (`x.y.z`)
  - A schema/DB field, API endpoint, or config key
  - Tags signaling code domain: `garmin-api`, `bullmq`, `cortex`, `nixos`, `redis`, `telegram`, `next-js`, `hono`, `bun`, etc.

  **Skip this step entirely** for memories tagged with non-code domains: `training`, `running-analysis`, `crossfit-coach`, `journal`, `calendar`, `vault-review`, `srs`, `morning-briefing`, `weather`, `evening-journal`, `weekly-review`, `reflection-prompts`. Their truth lives outside the repo.

  For each code-coupled candidate (cap the check at 30 memories per run to stay within timeout):

  ```bash
  # Example: verify a memory mentioning `runForkedAgent` from autoDream
  grep -rn "runForkedAgent" /home/peterstorm/dev/claude-plugins/reclaw/src \
      /home/peterstorm/dev/claude-plugins/cortex/engine/src \
      /home/peterstorm/.dotfiles \
      --include="*.ts" --include="*.nix" -l 2>/dev/null | head -3
  ```

  Roots to grep (in order, stop at first hit):
  1. `/home/peterstorm/dev/claude-plugins/reclaw/src`
  2. `/home/peterstorm/dev/claude-plugins/reclaw/workspace/skills`
  3. `/home/peterstorm/dev/claude-plugins/cortex/engine/src`
  4. `/home/peterstorm/.dotfiles`

  **Decision rule:**
  - Symbol found → **keep** (memory still grounded in code)
  - Symbol absent → **archive with reason `code-drift`** and add to the Step 3 batch
  - Multiple symbols in one memory → drift only if **all** are absent (a partially-renamed memory deserves an update, not an archive — but we can't update from a scheduled job, so flag for human review by leaving it active)

  **Don't archive on drift if:**
  - Memory is `pinned`
  - Memory was created in the last 7 days (give librarian time to verify)
  - Symbol could plausibly live in a build artifact, lockfile, or external dep we haven't grepped

  Output for the batch summary: track `code-drift` archives separately so the final Telegram message can mention them.

  ## Step 3: Archive directly

  Archive all identified memories (from Step 2 AND Step 2.5) in a single batch — no confirmation needed:

  ```bash
  bun -e "
  import Database from 'bun:sqlite';
  const db = new Database('{{cwd}}/.memory/cortex.db');
  const ids = [/* full UUIDs to archive */];
  const now = new Date().toISOString();
  const cutoff7 = new Date(Date.now() - 7*24*60*60*1000).toISOString();
  // Hard invariant: never archive a fresh (<7d) skill-quality signal, no matter
  // what landed in the batch. The skill-quality-monitor reads this 7-day window.
  const stmt = db.prepare(\"UPDATE memories SET status = ?, updated_at = ? WHERE id = ? AND NOT (tags LIKE '%\\\"skill-quality\\\"%' AND created_at >= ?)\");
  let count = 0;
  for (const id of ids) {
    const result = stmt.run('archived', now, id, cutoff7);
    if (result.changes > 0) count++;
  }
  console.log('Archived', count, 'memories');
  const remaining = db.query(\"SELECT COUNT(*) as c FROM memories WHERE status = 'active'\").get();
  console.log('Active remaining:', remaining.c);
  db.close();
  "
  ```

  Do the same for global DB if needed.

  ## Step 4: Regenerate surface

  ```bash
  bun /home/peterstorm/.claude/plugins/cache/local/cortex/0.1.0/engine/src/cli.ts generate {{cwd}}
  ```

  ## Guidelines

  - Be aggressive: archived memories aren't deleted and can be restored
  - One per concept: if multiple memories describe the same thing, keep the most comprehensive
  - Favor summaries over details
  - Progress/session context decays fast — archive it
  - Merge conceptually similar architecture memories by keeping the best one

  ## Output

  - If memories were pruned: send a brief summary — how many reviewed, archived (split into normal-prune vs code-drift), remaining, and top reasons (1-3 bullet points). Keep it concise for Telegram.
  - If nothing needed pruning: respond with exactly `ALL_CLEAR`
