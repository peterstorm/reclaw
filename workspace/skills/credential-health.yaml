name: Credential Health
schedule: "30 5 * * *"  # daily 05:30 — deliberately ahead of every credential consumer (garmin-catchup 06:00, morning-briefing 07:20, tech-digest 08:00), so a repair lands before the day's skills need the credential. Manually triggerable via /run credential-health.
permissionProfile: scheduled
validityWindowMinutes: 60
timeout: 900
promptTemplate: |
  {{personality}}

  {{scheduledPreamble}}

  Time: {{dayOfWeek}}, {{date}}

  You are running the daily credential health check. It exists because two
  outages were caused by credentials expiring silently: a research job lost
  permanently on 2026-06-15 (NotebookLM cookies, ~24-day clock) and nine dead
  chat sessions on 2026-07-20 (expired agent OAuth token). Both were invisible
  until something tried to use them.

  Your job is to run one command and relay its verdict. Do not investigate, do
  not fix anything by hand, and do not editorialise — the script has already
  probed, repaired what could be repaired, and written the exact message to send.

  ## Step 1 — run the check

  ```
  bun {{scriptsDir}}/credential-health.ts
  ```

  It can take a few minutes: it makes real calls to NotebookLM and Garmin, and on
  a stale or failed credential it drives a full re-authentication. Progress
  chatter goes to stderr; stdout is JSON and nothing else.

  ## Step 2 — relay the verdict, verbatim

  The JSON has a `message` field, and that field is the whole output contract:

  - `message` is exactly `ALL_CLEAR` → respond with exactly ALL_CLEAR.
  - anything else → send that `message` text verbatim as your entire response.
    It is already written for Telegram, already ordered by severity, and already
    carries the remedy for each fault. A preamble, a summary or your own
    diagnosis only makes it longer on a phone screen.

  Never paste the raw JSON, and never include a credential, token or cookie value
  in your response — the script deliberately keeps them out of its own output.

  ## If the command itself fails

  If `bun` exits non-zero, prints no JSON, or the JSON has no `message` field,
  send this instead — and do **not** send ALL_CLEAR, because nothing was checked:

      🔴 credential-health could not run: <one-line reason, e.g. the exit status and last stderr line>

  A credential monitor that fails quietly is worse than no monitor: silence from
  this skill must always mean "checked, everything is fine".

  ## Design notes (do not output)

  Recorded so a future evolve run does not re-propose a variant already considered:

  - **NotebookLM auto-repairs, it does not merely warn.** The 06-16 proposal asked
    for warn-only because manual re-auth had just been built and was meant to stay
    deliberate. That reasoning expired with the credential: by 2026-08-09 the
    cached credentials.json was eight weeks old against a ~24-day clock, the auth
    probe returned 400, and nobody had noticed — warn-only would have produced
    eight weeks of ignored nags. Everything the re-auth needs (GOOGLE_EMAIL,
    GOOGLE_PASSWORD, PLAYWRIGHT_BROWSERS_PATH) is already in reclaw's systemd env.
  - **The age gate matters more than the probe.** Refreshing at 20 days converts a
    hard failure into no failure. A probe alone only converts a silent failure
    into a loud one.
  - **Garmin is not probed like the others.** garmin-fetch already self-heals —
    load cached tokens, verify, fall back to a full login — so a cached token
    expiring is the normal path, not an incident. The script attempts a login only
    on the branch where the cached token was already rejected, which is the only
    branch that reveals whether GARMIN_EMAIL/GARMIN_PASSWORD still work. Do not
    "fix" this by adding a daily Garmin login.
  - **Agent tokens are warn-only by necessity**, not preference: both backends need
    an interactive re-login, so advance notice is the entire value. Only backends
    actually in use are probed (AGENT_BACKEND plus any skill's `backend:`
    override), so flipping the backend leaves neither a gap nor extra noise.
  - **Repairs are cooldown-gated (6h).** Both repair paths drive a real remote
    login; a repeated `/run` must not hammer Google or lock the Garmin account.
