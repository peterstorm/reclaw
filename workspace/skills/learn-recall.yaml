name: Learn — Recall Round
# 11:30 / 15:30 / 19:30: asks up to 3 FSRS-due recall cards (interleaved across topics, new
# cards capped per day). The CLI renders the questions (`round --message`) and the graded
# result (`round-result`); the user answers by swipe-replying in their own words, and this
# same session grades each answer — the one irreducible judgment the model owns. Scheduling
# is FSRS's job. Replaces vault-review.
# See vault: reclaw/skills/learning-loop.md
schedule: "30 11,15,19 * * *"
permissionProfile: scheduled
validityWindowMinutes: 90
timeout: 300
promptTemplate: |
  {{personality}}

  Today is {{dayOfWeek}}, {{date}}.

  You run a spaced-repetition recall round over the user's curriculum cards. They answer in
  their own words by swipe-replying to your message; you grade later in this same session.
  Scheduling (FSRS) is entirely the CLI's job — you only judge answers, assign one of four
  labels, and record them.

  ## Step 1 — Get the questions

  ```
  bun {{scriptsDir}}/learn.ts round --message
  ```

  The CLI picks the cards, records the round AND renders the message. Relay what it printed,
  verbatim. It prints exactly ALL_CLEAR — nothing else — when nothing is due; relay that too,
  the runtime suppresses it. Relay ALL_CLEAR only when the CLI printed it: never send it
  yourself and never send an empty message. A non-zero exit means the CLI refused and printed
  the reason on stderr — report that reason in one line and stop; nothing was recorded.

  ## Step 2 — Keep the round for grading

  ```
  bun {{scriptsDir}}/learn.ts last-round
  ```

  → `{ round, askedAt, cards: [{ id, topicTitle, lesson, question, answer, graded }] }`. This
  is your whole grading input: map each numbered question to its `id`, and grade against its
  reference `answer` — which the learner never saw.

  ## When the user replies (this session is resumed) — grade

  For each numbered answer, compare its MEANING with that card's reference answer (the
  reference names the key points a correct answer must contain):
  - **again** — core idea missing or wrong; or "?", blank, "don't know".
  - **hard** — core idea right, but a key point missing or a notable error / imprecision.
  - **good** — all key points present. Wording may differ completely.
  - **easy** — complete and precise AND fluent: correctly extends, applies, or quantifies.
  Judge substance, never phrasing or length. Between two grades, pick the lower.

  Record every grade, passing their answer verbatim on stdin through a QUOTED heredoc so
  nothing in it is interpreted by the shell:

  ```
  bun {{scriptsDir}}/learn.ts grade <round> <card-id> <again|hard|good|easy> --answer - <<'ANSWER'
  <their answer for that card, verbatim>
  ANSWER
  ```

  Then relay the rendered round result verbatim:

  ```
  bun {{scriptsDir}}/learn.ts round-result <round>
  ```

  (`round-result last` works too.) The numbers it prints are the numbers the learner saw, so
  a skipped question leaves a gap. If it refuses because `round "<id>" has no graded card yet`,
  nothing was graded: say so in one line instead of relaying a round result. Add nothing after
  it except, when the user asked a question, a one-line answer fetched from
  `bun {{scriptsDir}}/learn.ts section <topic-slug> <lesson>`.

  Rules:
  - Answered only some? Grade those only. Unanswered cards stay pending and return in a later
    round — never grade them yourself.
  - Dispute / override ("2 was good", "override 2 hard"): `last-round` lists the cards in
    asked order, and that position is the number the learner used. Re-run `grade` with the
    same round, that card's id and THEIR grade (the CLI records it as an override). The
    user's call wins. Confirm in one line.
  - Broken card ("that question is ambiguous / wrong"): run
    `bun {{scriptsDir}}/learn.ts suspend <card-id> <their reason>` and say it is suspended
    until the note is fixed. Don't grade it.
