name: Cortex Usefulness Signal (v0)
schedule: "0 0 * * *"  # midnight — runs BEFORE cortex-prune (which now depends on this) so usefulness bumps land while memories are still active and prune can honor them.
permissionProfile: scheduled
validityWindowMinutes: 60
timeout: 300
promptTemplate: |
  {{personality}}

  Time: {{dayOfWeek}}, {{date}}

  You are running cortex usefulness analysis (v0). The goal: detect cortex memories
  that were *actually used* by the assistant in recent sessions and reward them with
  a modest access-count bump, so consistently-helpful memories rank higher over time.

  CRITICAL: This is an automated job. No user is present. Execute all steps silently;
  no confirmation prompts. Bump magnitude is intentionally small for v0 — wrong
  classifications cost little.

  Each step writes its output to a file under `~/.cache/reclaw/cortex-usefulness/`
  and the next step reads it. Run the commands **verbatim** — there are no
  placeholders to substitute. This is deliberate: summaries contain double quotes,
  apostrophes and `$`, and pasting them into a `bun -e "..."` shell string (as this
  skill used to require) breaks the command outright or silently mangles the text.

  ## Step 1: Detect surfaced→used pairs

  Run this Bun helper. It parses transcripts touched in the last 24h from **both**
  agent backends, finds the CORTEX_RECALL block in each, then computes Jaccard
  token overlap between each surfaced memory's summary and the next assistant
  turn's text. Returns a deduplicated list of useful summaries with score.

  Both backends must be scanned because `AGENT_BACKEND` decides where reclaw's own
  scheduled runs are recorded, and it has been flipped between `claude` and `pi`
  more than once. Scanning only Claude — as this skill did until 2026-08-09 —
  silently dropped every autonomous run while the Claude directory kept producing
  enough unrelated sessions to keep the recall-death alarm quiet. The two backends
  record the recall surface in different envelopes:

  | Backend | Recall record | Assistant turn |
  |---|---|---|
  | claude | `type: attachment`, `attachment.hookEvent: UserPromptSubmit`, text in `attachment.content` | `type: assistant`, blocks in `message.content` |
  | pi | `type: custom_message`, `customType: cortex-memory`, text in `content` | `type: message`, `message.role: assistant`, blocks in `message.content` |

  In both cases assistant text lives in blocks carrying a `.text` field; thinking
  blocks carry `.thinking` instead and are correctly ignored.

  ```bash
  bun -e "
  import { readFileSync, writeFileSync, mkdirSync } from 'fs';
  import { join } from 'path';
  import { homedir } from 'os';
  import { execSync } from 'child_process';

  const RUN_DIR = join(homedir(), '.cache/reclaw/cortex-usefulness');

  const BACKENDS = [
    { backend: 'claude', dir: '/home/peterstorm/.claude/projects/-home-peterstorm-dev-claude-plugins-reclaw-workspace' },
    { backend: 'pi',     dir: '/home/peterstorm/.pi/agent/sessions/--home-peterstorm-dev-claude-plugins-reclaw-workspace--' },
  ];

  // Stop words mirror prompt-recall STOP_WORDS subset
  const STOP = new Set(['the','a','an','is','are','was','were','be','to','of','and','or','in','on','for','with','that','this','it','as','at','by','from','but','if','then','also','can','will','would','should','could','have','has','had','do','does','did','not','no','yes','use','make','get','set','run','show','tell','what','how','where','when','why','who','which']);

  function tokenize(text) {
    return new Set(text.toLowerCase().replace(/[^\w\s]/g,' ').split(/\s+/).filter(t => t.length > 2 && !STOP.has(t)));
  }
  function jaccard(a, b) {
    if (!a.size || !b.size) return 0;
    const inter = [...a].filter(x => b.has(x)).length;
    return inter / new Set([...a, ...b]).size;
  }

  const RECALL_RE = /<!-- CORTEX_RECALL_START -->([\s\S]*?)<!-- CORTEX_RECALL_END -->/;
  const THRESHOLD = 0.10; // calibrated 2026-05-07 against ~24h of transcripts: catches ~1% of surfaced as 'useful', mostly genuine

  // Per-backend envelope readers. Return the recall text, or null if this record
  // is not a recall surface for that backend.
  function recallContent(backend, obj) {
    if (backend === 'claude') {
      if (obj.type === 'attachment' && obj.attachment?.hookEvent === 'UserPromptSubmit') return obj.attachment.content || '';
      return null;
    }
    if (obj.type === 'custom_message' && obj.customType === 'cortex-memory') return obj.content || '';
    return null;
  }

  // Return the assistant turn's plain text, or null if this record is not an
  // assistant turn for that backend.
  function assistantText(backend, obj) {
    const msg = backend === 'claude'
      ? (obj.type === 'assistant' ? obj.message : null)
      : (obj.type === 'message' && obj.message?.role === 'assistant' ? obj.message : null);
    if (!msg) return null;
    const c = msg.content;
    if (typeof c === 'string') return c;
    if (Array.isArray(c)) return c.map(b => b.text || '').join(' ');
    return '';
  }

  const bestPerSummary = new Map();
  const byBackend = {};
  let totalFiles = 0;
  let totalSurfaced = 0;
  let totalRecallTurns = 0;

  for (const { backend, dir } of BACKENDS) {
    let files = [];
    try {
      files = execSync('find ' + dir + ' -maxdepth 1 -name \"*.jsonl\" -mtime -1 2>/dev/null', { encoding: 'utf8' })
        .split('\n').filter(Boolean);
    } catch { files = []; }  // directory absent for a backend that has never run

    let recallTurns = 0;
    let surfaced_total = 0;

    for (const file of files) {
      let raw;
      try { raw = readFileSync(file, 'utf8'); } catch { continue; }

      let currentRecall = null;
      for (const line of raw.split('\n').filter(Boolean)) {
        let obj;
        try { obj = JSON.parse(line); } catch { continue; }

        const recall = recallContent(backend, obj);
        if (recall !== null) {
          const m = recall.match(RECALL_RE);
          if (!m) continue;
          const surfaced = [];
          const re = /^- \[\w+\] (.+)$/gm;
          let mm;
          while ((mm = re.exec(m[1])) !== null) surfaced.push(mm[1]);
          if (surfaced.length > 0) {
            currentRecall = surfaced;
            recallTurns++;
            surfaced_total += surfaced.length;
          }
          continue;
        }

        if (!currentRecall) continue;
        const text = assistantText(backend, obj);
        if (text === null) continue;
        // Skip tool-only / empty assistant turns but DON'T clear currentRecall —
        // attribute the recall to the next turn that actually has text.
        if (!text) continue;
        const aTokens = tokenize(text);
        for (const summary of currentRecall) {
          const score = jaccard(tokenize(summary), aTokens);
          if (score >= THRESHOLD) {
            const prev = bestPerSummary.get(summary);
            if (!prev || score > prev) bestPerSummary.set(summary, score);
          }
        }
        currentRecall = null;
      }
    }

    byBackend[backend] = { files: files.length, recall_turns: recallTurns, surfaced_total };
    totalFiles += files.length;
    totalRecallTurns += recallTurns;
    totalSurfaced += surfaced_total;
  }

  const useful = [...bestPerSummary.entries()]
    .map(([summary, score]) => ({ summary, score: Number(score.toFixed(3)) }))
    .sort((a, b) => b.score - a.score);

  // A backend that produced transcripts but no recall blocks is parser drift for
  // THAT backend. Reported separately because the aggregate hides it: a healthy
  // second backend keeps recall_turns > 0 and the alarm silent.
  const deadBackends = Object.entries(byBackend)
    .filter(([, s]) => s.files > 0 && s.recall_turns === 0)
    .map(([b]) => b);

  const result = {
    files: totalFiles,
    recall_turns: totalRecallTurns,
    surfaced_total: totalSurfaced,
    by_backend: byBackend,
    dead_backends: deadBackends,
    useful: useful,
  };
  mkdirSync(RUN_DIR, { recursive: true });
  writeFileSync(join(RUN_DIR, 'step1.json'), JSON.stringify(result, null, 2));
  console.log(JSON.stringify(result, null, 2));
  "
  ```

  If the JSON output has `useful: []` (empty), skip Steps 2 and 3 (nothing to map or
  bump) but **still run the tracker in Step 2's divergence-check block** — the
  recall-death counter must update even on a no-useful day, since recall death *looks*
  like a quiet day. Set `matched.length = 0` for the tracker, then go to Step 4.

  ## Step 2: Map summaries to memory IDs

  For each `useful.summary`, look up the matching active memory ID in the cortex DB.
  Match on exact summary equality. Skip candidates that don't match (the memory may
  have been archived since the recall).

  Exact equality is correct even for summaries ending in `...`. Verified 2026-08-09:
  those are truncated when *written* to cortex (24 of 423 active memories are stored
  clipped to 200 chars including the ellipsis), so the recall surface renders them
  verbatim and they compare equal. Do not "fix" this with prefix matching — there is
  no truncation happening between the store and the surface.

  The `unmatched` count is reported so the routine case (archived since recall) stays
  distinguishable from the pathological one (`matched === 0`, caught by the divergence
  tracker below).

  ```bash
  bun -e "
  import Database from 'bun:sqlite';
  import { readFileSync, writeFileSync } from 'fs';
  import { join } from 'path';
  import { homedir } from 'os';
  const RUN_DIR = join(homedir(), '.cache/reclaw/cortex-usefulness');
  const step1 = JSON.parse(readFileSync(join(RUN_DIR, 'step1.json'), 'utf8'));
  const summaries = step1.useful.map(u => u.summary);
  const db = new Database('{{cwd}}/.memory/cortex.db', { readonly: true });
  const active = db.prepare(\"SELECT id, summary FROM memories WHERE status = 'active'\").all();
  const byExact = new Map(active.map(r => [r.summary, r.id]));
  const matched = [];
  let unmatched = 0;
  for (const s of summaries) {
    const id = byExact.get(s);
    if (id !== undefined) matched.push(id);
    else unmatched++;
  }
  writeFileSync(join(RUN_DIR, 'matched.json'), JSON.stringify(matched));
  console.log(JSON.stringify({ matched: matched.length, unmatched }));
  db.close();
  "
  ```

  ### Divergence check (insurance against silent matcher failure)

  If `useful.length > 0` but `matched.length === 0`, the Step 1 regex extracted
  summaries that don't exist verbatim in the active cortex store. That can
  happen if the recall surface ever truncates summaries, normalises whitespace
  differently, or if the schema changes — and the skill would otherwise still
  report "useful detected, 0 bumped" and look healthy.

  This block tracks TWO independent silent-failure modes in
  `~/.cache/reclaw/cortex-usefulness-divergence.json` (create dir/file if missing):

  1. **Matcher divergence** (`streak`): `useful > 0` but `matched === 0` — Step 2's
     summary lookup is failing (schema/format drift).
  2. **Recall death** (`recall_dead_streak`): a backend where `files > 0` but
     `recall_turns === 0` — Step 1 found that backend's transcripts but extracted zero
     CORTEX_RECALL blocks from them. This is the dangerous mode: it looks identical to a
     quiet day (`useful: []` → `ALL_CLEAR`), so without this counter a broken recall
     hook / changed block format would silence the skill forever with no alert.

     Evaluated **per backend** (`dead_backends` from Step 1), not on the aggregate.
     That is exactly how this skill's Pi blindness went unnoticed for months: with
     only an aggregate counter, the Claude directory's unrelated sessions kept
     `recall_turns > 0` while every `pi` transcript went unparsed.

  Format:

  ```json
  {"streak": 0, "last_divergence_date": null, "last_match_date": null,
   "recall_dead_streak": 0, "last_recall_dead_date": null, "last_recall_date": null,
   "dead_backends": []}
  ```

  Update logic (run after Step 2 produces `matched`):

  ```bash
  bun -e "
  import { readFileSync, writeFileSync, mkdirSync } from 'fs';
  import { dirname, join } from 'path';
  import { homedir } from 'os';
  const RUN_DIR = join(homedir(), '.cache/reclaw/cortex-usefulness');
  const path = join(homedir(), '.cache/reclaw/cortex-usefulness-divergence.json');
  const today = new Date().toISOString().slice(0, 10);
  const step1 = JSON.parse(readFileSync(join(RUN_DIR, 'step1.json'), 'utf8'));
  // matched.json is absent when Step 2 was skipped for an empty useful list.
  let matchedIds = [];
  try { matchedIds = JSON.parse(readFileSync(join(RUN_DIR, 'matched.json'), 'utf8')); } catch { matchedIds = []; }
  const deadBackends = step1.dead_backends;
  const usefulCount = step1.useful.length;
  const matchedCount = matchedIds.length;
  let state;
  try { state = JSON.parse(readFileSync(path, 'utf8')); }
  catch { state = {}; }
  state = { streak: 0, last_divergence_date: null, last_match_date: null,
            recall_dead_streak: 0, last_recall_dead_date: null, last_recall_date: null,
            dead_backends: [], ...state };
  // Mode 1: matcher divergence (only meaningful when there was something to match)
  if (usefulCount === 0) {
    // no signal — leave divergence counters untouched
  } else if (matchedCount > 0) {
    state.streak = 0;
    state.last_match_date = today;
  } else {
    state.streak = (state.streak || 0) + 1;
    state.last_divergence_date = today;
  }
  // Mode 2: recall death, evaluated per backend. Any backend that produced
  // transcripts but no recall blocks counts as dead, even if the other backend
  // is healthy — that masking is precisely what hid the Pi gap.
  if (deadBackends.length > 0) {
    state.recall_dead_streak = (state.recall_dead_streak || 0) + 1;
    state.last_recall_dead_date = today;
    state.dead_backends = deadBackends;
  } else {
    state.recall_dead_streak = 0;
    state.last_recall_date = today;
    state.dead_backends = [];
  }
  mkdirSync(dirname(path), { recursive: true });
  writeFileSync(path, JSON.stringify(state, null, 2));
  console.log(JSON.stringify(state));
  "
  ```

  Carry both `streak` and `recall_dead_streak` into Step 4.

  ## Step 3: Bump useful memories

  For each matched ID, increment `access_count += 2` and update `last_accessed_at`.
  +2 is intentionally small: existing ranking weights `log(access+1)/maxLog × 0.15`,
  so 5 successful uses ≈ one full point of ranking weight — meaningful but not
  dominant over confidence + centrality.

  ```bash
  bun -e "
  import Database from 'bun:sqlite';
  import { readFileSync } from 'fs';
  import { join } from 'path';
  import { homedir } from 'os';
  const ids = JSON.parse(readFileSync(join(homedir(), '.cache/reclaw/cortex-usefulness/matched.json'), 'utf8'));
  const db = new Database('{{cwd}}/.memory/cortex.db');
  const now = new Date().toISOString();
  const stmt = db.prepare('UPDATE memories SET access_count = access_count + 2, last_accessed_at = ?, updated_at = ? WHERE id = ?');
  let count = 0;
  for (const id of ids) {
    const result = stmt.run(now, now, id);
    if (result.changes > 0) count++;
  }
  console.log('Bumped', count, 'memories');
  db.close();
  "
  ```

  ## Step 4: Output

  This skill is **telemetry, not a notification** — apply the bumps from Step 3 silently
  and, on a routine day, emit nothing. Decide the output as follows:

  1. **Alert conditions (emit a Telegram message).** If either is true, send only the
     relevant warning line(s) — substitute the real integer from the tracker for
     `<streak>` / `<recall_dead_streak>`:

     - `streak >= 3`:

           ⚠️ Cortex-usefulness matcher divergence: useful>0 but matched=0 for <streak> days running. Step 2 lookup is failing — schema/format may have drifted. Investigate before the signal becomes meaningless.

     - `recall_dead_streak >= 3` — substitute the real backend names for `<dead_backends>`:

           ⚠️ Cortex-usefulness recall death on backend(s) <dead_backends>: transcripts scanned but 0 CORTEX_RECALL blocks found for <recall_dead_streak> days running. The recall hook or that backend's transcript format likely changed — usefulness signal from those runs is being dropped silently. Investigate.

  2. **Routine success (no alert condition).** Respond with exactly ALL_CLEAR — no
     backticks, no formatting, nothing else. Bumps were still applied; the daily
     files-scanned / useful / bumped stats roll up into `skill-quality-monitor`'s
     weekly view rather than pinging the user every night.

  ## Tuning notes (do not output)

  - Threshold 0.10 was calibrated against ~355 transcripts / ~933 surfaced memories
    on 2026-05-07. Top scores manually inspected — mostly genuine references at
    0.10+. If false positives become noticeable, raise to 0.12 or 0.15.
  - Bump magnitude (+2): conservative. Half the original +3 proposal — wanted
    smaller because positive-only signal can compound on the same memory across
    days. Re-evaluate after a week of operation.
  - Negative signal (memory shown but ignored, or assistant had to re-derive)
    is OUT OF SCOPE for v0. Add later if positive-only proves the architecture.
  - Per-run dedup: if a memory is surfaced multiple times in a day, it gets ONE
    bump per run (the highest score). Prevents over-rewarding noisy popular
    memories like top-of-surface architectural facts.
