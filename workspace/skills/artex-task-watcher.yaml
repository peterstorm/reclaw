name: ARTEX Task Watcher
# Programmatic since 2026-11-18: runs the in-process script below — no LLM, no agent
# subprocess, no quota. Pure diff job: only pages on task completion transitions
# (or a NEW failure cause). Manually triggerable via /run artex-task-watcher.
# To pause: `schedule: null` (hot-reloads; the skill stays manually runnable).
schedule: "*/15 * * * *"
permissionProfile: scheduled
script: artex-task-watcher.ts
validityWindowMinutes: 15
timeout: 120
