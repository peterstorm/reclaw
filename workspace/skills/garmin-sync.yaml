name: Garmin Daily Sync
schedule: "0 20 * * *"
permissionProfile: scheduled
validityWindowMinutes: 60
promptTemplate: |
  {{personality}}

  Today is {{dayOfWeek}}, {{date}}.

  You are syncing daily fitness data from Garmin Connect and writing it to the Obsidian vault.

  ## Step 1 — Fetch Garmin data

  Run the Garmin fetch script with today's date (this runs at 20:00, capturing the day's data):
  ```
  bun {{scriptsDir}}/garmin-fetch.ts {{date}}
  ```

  If it fails with an auth error, report the failure and stop — don't write a vault note with no data.
  If it fails on individual metrics (partial failure), continue — the JSON will have nulls for missing sections.

  ## Step 2 — Parse the data

  The script outputs JSON to stdout. Parse it and extract:
  - `date` — the date this data covers (today, since the sync runs at 20:00)
  - `sleep` — score, duration, deep/light/REM/awake stages
  - `steps` — step count
  - `heartRate` — resting, max, min
  - `activities` — list of activities with type, duration, distance, HR, pace, training effect, HR zones, splits, hrTimeSeries, perceivedExertion (0-100 scale, display as 1-10), feelScore (1-5: awful to amazing), description (user-written notes from the Garmin app)
  - `vo2Max` — running and cycling VO2 max values
  - `trainingStatus` — current training status and related metrics
  - `trainingReadiness` — score (0-100), level, sleepScore, recoveryTime (hours), hrvStatus
  - `hrv` — heart rate variability (weekly avg and last night)
  - `scheduledWorkouts` — workouts scheduled for the day (title, description with workout structure, steps with pace targets, provider). May be empty.
  - `errors` — any fetch failures (note them but don't let them block the vault note)

  Each activity includes `hrTimeSeries` — array of `{timestamp, heartRate}` points sampled throughout the activity (up to 1000 points). Use for interval analysis.

  ### HR Zone Reference (Garmin LTHR-derived)

  The zones are anchored to the lactate-threshold heart rate (LTHR). **Prefer the value Garmin
  auto-detects** — read `lactateThreshold.heartRate` from the fetched JSON and use it as the LTHR
  so the zones track the athlete's current fitness (the running-coach treats the JSON as
  authority; this note should not diverge). Only fall back to the table below (LTHR **175 bpm**)
  if the JSON has no `lactateThreshold.heartRate`.

  At LTHR 175 the boundaries are:

  | Zone | Name | BPM Range | % of LTHR |
  |------|------|-----------|-----------|
  | Z1 | Warmup | < 142 | < 81% |
  | Z2 | Easy | 142–156 | 81–89% |
  | Z3 | Aerobic | 156–168 | 89–96% |
  | Z4 | Threshold | 168–175 | 96–100% |
  | Z5 | Maximum | > 175 | > 100% |

  For a different detected LTHR, scale the boundaries by the same % columns. **Always use
  LTHR-relative boundaries** when classifying time-in-zone — never arbitrary thresholds.

  ## Step 3 — Pull historical context (REQUIRED)

  **Never write a fitness note without first reading recent history.** Trend comparison and progressive-overload tracking are core to this skill — not optional flourishes. If today has no activity, you can skip this step; otherwise it is mandatory.

  ### 3a. Recent fitness notes (general trend window)

  ```
  find ~/dev/notes/remotevault/personal/fitness/ -name "*.md" -not -name "MOC.md" | sort -r | head -7
  ```

  Read the most recent **5–7 notes** to extract daily metrics (sleep, HRV, RHR, VO2 max, training status, training load).

  ### 3b. Last 3–5 runs (if today has a running activity)

  Grep across the last ~30 days of fitness notes for run analyses (`-newermt` takes a time expression; `-newer` would expect a reference *file*):
  ```
  find ~/dev/notes/remotevault/personal/fitness/ -name "*.md" -newermt '30 days ago' 2>/dev/null | sort -r | head -30
  ```
  Open the most recent files until you have collected the last **3–5 runs** worth of: distance, avg pace, avg HR, HR zone distribution, pace:HR ratio, training effect, perceived exertion. This is the dataset for the run trend comparison in Step 4.

  ### 3c. Last 5–10 CrossFit/strength sessions (if today has a CrossFit/strength activity)

  **First, `/recall` the per-movement ledger instead of re-deriving it.** Every prior run of
  this skill stored a one-line `Strength [date]: <per-movement loads>` memory (Step 6) for
  exactly this purpose. Run `/recall "Strength"` (and `/recall "strength ledger"`) to pull the
  recent per-movement history back cheaply. Only fall back to reading fitness notes for
  movements the recalled memories don't cover, or if recall returns nothing.

  When you do need notes: strength sessions happen 2–3×/week, so a 5-note window is too short. Walk back further — up to 30 days — and read every fitness note that contains a CrossFit/Strength Analysis section. For each previous session, extract:
  - Date and session format (EMOM / AMRAP / For Time / Strength / Mixed)
  - Per-movement load and reps from `completedSets` (e.g. "Back Squat: 5×5 @ 100kg", "Pull-ups: 4×8 strict")
  - Total training load, anaerobic TE, duration, RPE/feel
  - Movement patterns (lower-body barbell, gymnastics pulling, monostructural, etc.)

  Build a small in-memory ledger of "movement → recent set/rep/load history" so you can answer **per-movement progressive-overload questions** in Step 4. If a movement appearing today also appears in a previous session, you must compare directly. If it's new (first appearance in 30 days), say so explicitly.

  ## Step 3.5 — Idempotency & late-activity backfill check

  This skill is **idempotent and backfill-safe**: it may run more than once for the same date
  (the 20:00 sync, plus the morning `garmin-catchup` re-run for yesterday). The dedup unit is the
  **set of activity IDs**, not the mere existence of the note — because an activity logged *after*
  the 20:00 sync (e.g. a late evening run) must be allowed to backfill into an already-written note.

  Every note this skill writes carries a machine-readable marker on its **last line**:
  ```
  <!-- garmin-sync: activityIds=[<comma-separated ids>]; lastSynced=<ISO8601>; backfilled=<true|false> -->
  ```
  (`activityIds=[]` for a day with no activities.)

  Decision logic:

  1. Build `fetchedIds` = the set of `activityId` values from the fresh fetch (empty set if none).
  2. Check whether the target note exists at `~/dev/notes/remotevault/personal/fitness/YYYY/MM/YYYY-MM-DD.md`.
     - **No note** → proceed to Step 4 and write it (`backfilled=false`).
     - **Note exists** → read its `garmin-sync:` marker and parse `notedIds`.
       - If `fetchedIds ⊆ notedIds` (the note already accounts for every fetched activity) →
         respond `ALL_CLEAR` and stop. Nothing changed; do **not** rewrite the note or re-run Steps 5–6.
       - If `fetchedIds` contains any ID **not** in `notedIds` (a late activity has appeared) →
         **regenerate the note wholesale** from the fresh, now-complete fetch (Step 4) and set
         `backfilled=true`. Regeneration overwrites the file in place — it never appends — so an
         activity can never be double-logged. Add a short blockquote near the top noting the note
         was backfilled with the late activity (time + type), so the change is visible to the reader.
       - If the note has **no marker** (legacy note written before this scheme) → treat it as
         `notedIds = ∅`: regenerate if there are any activities, otherwise just append a fresh
         marker without rewriting the prose.

  ## Step 4 — Write the daily fitness note

  Create the note at: `~/dev/notes/remotevault/personal/fitness/YYYY/MM/YYYY-MM-DD.md`
  where YYYY-MM-DD is the **data date** (today, {{date}} — this sync runs at 20:00 and captures the current day).
  Create year/month directories if needed.

  **Frontmatter:**
  ```yaml
  ---
  title: "Fitness — YYYY-MM-DD"
  date: YYYY-MM-DD
  tags: [fitness, garmin, daily]
  up: "[[personal/fitness/MOC|Fitness]]"
  ---
  ```

  **Note structure:**

  ### Overview
  A quick-glance summary table:
  | Metric | Value |
  |--------|-------|
  | Steps | X,XXX |
  | Resting HR | XX bpm |
  | Sleep Score | XX/100 |
  | Sleep Duration | Xh XXm |
  | VO2 Max | XX.X |
  | Training Status | [status] |
  | HRV | XX ms |
  | Training Readiness | XX/100 ([level]) |

  Skip any row where the data is null.

  ### Sleep
  - Score, total duration
  - Stage breakdown: deep, light, REM, awake — both duration and percentage
  - Brief comparison to recent notes if available (e.g. "sleep score trending up this week")

  ### Training Readiness
  If trainingReadiness data exists:
  - Overall readiness score and level
  - Sleep score component (from readiness, not the separate sleep section)
  - Recovery time remaining (hours)
  - HRV status

  Brief interpretation: was the body ready for training? If a run was done, note whether the readiness score supported the effort level.

  ### Scheduled Workouts
  If scheduledWorkouts is non-empty, list them. Note whether each was completed (matching activity exists) or missed.
  If empty, skip this section.

  ### Activities
  For each activity logged that day:
  - Type, name, duration, distance
  - Average/max HR, HR zone time distribution
  - Calories, elevation gain (if applicable)
  - Training effect (aerobic + anaerobic)
  - Perceived exertion (show as X/10 from the 0-100 raw value) and feel (1-5 scale) if present
  - User notes (if `description` is non-null, include it as a blockquote under the activity — these are the user's own thoughts from the Garmin app)

  **If there are running activities, add a detailed Run Analysis subsection:**

  #### Run Analysis
  - **Pre-run readiness**: If trainingReadiness data exists, summarize the body's state going into the run — readiness score, sleep quality, recovery time, HRV status. Frame the run performance in this context (e.g. "solid effort despite low readiness of 38" or "good conditions — readiness was 72 with full recovery")
  - **Pace**: Overall average pace (min/km), and per-km splits if available
  - **HR zones**: Time in each zone — was it an easy run, tempo, threshold, or intervals?
  - **HR timeline**: If hrTimeSeries data exists, analyze HR progression through the run:
    - For **intervals**: identify work/rest segments by HR spikes and valleys. Report peak HR during intervals, recovery HR between intervals, and recovery speed (how quickly HR drops)
    - For **steady runs**: report HR drift — did HR climb significantly at the same pace? (cardiac drift > 5% suggests fatigue or dehydration)
    - For **any run**: note warm-up HR ramp, peak HR and when it occurred, and cooldown pattern
  - **Aerobic efficiency**: Pace vs HR ratio — lower HR for same pace = better fitness
  - **Cadence**: Steps per minute if available
  - **Training effect**: Aerobic and anaerobic values and what they indicate
  - **VO2 max impact**: Did this run contribute to VO2 max estimation?
  - **Trend comparison (REQUIRED)**: Using the last 3–5 runs collected in Step 3b, build an explicit comparison:
    - Table or bullet list of: date · distance · avg pace · avg HR · pace:HR ratio · aerobic TE
    - Is pace improving at the same HR? (aerobic development) — quantify the delta
    - Is HR drift increasing during runs? (potential fatigue)
    - Are training effects appropriate for the training phase?
    - Call out the longest, fastest, and lowest-HR run in the window so progress (or regression) is visible at a glance
    - If today is the first run in 30 days, say so explicitly instead of inventing a comparison
  - **Commentary**: Comprehensive, honest training analysis — don't hold back on detail:
    - Classify the run type based on HR zones and pace (easy/recovery, tempo, threshold, intervals, long run)
    - Evaluate whether the effort matched the likely training intent — e.g. was an "easy run" actually easy? Did HR stay in zone 2?
    - Assess aerobic development: is pace improving at the same HR over weeks? Calculate and compare pace:HR ratios across recent runs
    - Flag fatigue signals: elevated resting HR, declining HRV, increasing HR drift during runs, or worsening pace:HR ratio
    - If consecutive hard days (high training effect or zone 4-5 time): recommend recovery and explain why
    - If training status is "Unproductive", "Overreaching", or "Detraining": explain what it means and suggest corrective action
    - Note positive trends explicitly — fitness gains deserve recognition (e.g. "VO2 max up 0.5 over 2 weeks", "aerobic efficiency improving")
    - Consider the weekly training load balance: too much intensity? Not enough volume? Good mix?
    - If sleep score or HRV is notably poor, connect it to training context (recovery debt, potential illness, life stress)
    - If training readiness was low but the run was still strong — note the resilience but flag recovery cost
    - If training readiness was high and performance was poor — flag possible external factors (nutrition, hydration, weather)
    - **Subjective effort vs objective data**: If perceivedExertion or feelScore is present, compare them against what the HR/pace data shows. A high RPE with low HR could indicate fatigue, poor sleep, or heat; a low RPE with high HR suggests strong fitness or flow state. If feel was poor (1-2) despite decent metrics, flag possible external stressors. If feel was great (4-5) with strong data, highlight the positive session quality. These subjective signals are valuable context that pure metrics miss.
    - Suggest what the next run should look like based on current recovery state and recent training load

  **If there are CrossFit, HIIT, or strength activities, add a detailed CrossFit/Strength Analysis subsection:**

  An activity qualifies if `activityType` is one of: `strength_training`, `hiit`, `fitness_equipment`, `training`, `indoor_cardio` — OR if the activity name contains any of: "CrossFit", "WOD", "AMRAP", "EMOM", "Metcon", "Strength", "Functional".

  #### CrossFit/Strength Analysis

  - **Workout content**: Each activity has two complementary fields:
    - `associatedWorkout` — the **prescription** (planned workout). `workoutName`, `description`, `steps[]` (each with `category`, `exerciseName`, prescribed `weightKg`, `durationSeconds`).
    - `completedSets` — the **actuals** that the watch recorded and the user confirmed/edited in Garmin Connect. Array of per-set entries: `{ setIndex, wktStepIndex, setType, category, exerciseName, reps, weightKg, durationSeconds, startTime }`. Weights are in kg; `reps: null` typically means a movement Garmin can't auto-count (pull-ups, ring dips, T2B) and the user didn't enter reps; `weightKg: 0` is explicit bodyweight; `category: "UNKNOWN"` usually marks rest/transitions and should be filtered out of the working-set view (or labelled as rest using `setType`).

    Always prefer `completedSets` over the prescription when both exist — the prescription is what was planned, the sets are what actually happened. Group `completedSets` by `wktStepIndex` (or by `category`/`exerciseName` if `wktStepIndex` is null) to produce per-movement set-by-set lines like "Bench Press: 6@70kg, 5@70kg, 5@70kg, 6@70kg".

    Also check the activity's own `description` field for user-written notes (subjective notes, scores, modifications) and the `scheduledWorkouts` array as a last fallback if `associatedWorkout` is null.

    Present the workout content prominently:
    - **Format**: EMOM / AMRAP / For Time / Tabata / Strength / custom
    - **Movements (actual)**: From `completedSets` — per-movement reps×weight, listing every set. If reps are missing for a movement, fall back to the prescription rep target and flag it ("pull-ups: prescribed 6-8/set, count not recorded").
    - **Plan vs actual deviation**: If actuals differ from the prescription (missed reps, lighter/heavier load, fewer rounds), call it out explicitly. This is the high-signal data — note both successes (hit prescribed reps at heavier load) and shortfalls (5 instead of 6 on later sets indicates fatigue or load too high).
    - **Score/result**: If the activity description contains a score (rounds+reps for AMRAP, time for For Time), include it.
    - If no completed sets, no prescription, and no description exists, note "unstructured session" and analyze from metrics only.

  - **Session type classification** based on HR zones, training effect, AND workout content:
    - Primarily aerobic (>60% time in Z1-Z3, aerobic TE > anaerobic TE) → "Endurance/Conditioning WOD"
    - Mixed (~40-60% Z4-Z5, both TEs significant) → "Mixed Modal"
    - Primarily anaerobic (>40% Z4-Z5, anaerobic TE > aerobic TE) → "High-Intensity WOD"
    - Low HR throughout (<50% Z3+) → "Strength/Skill focused"
    - Refine using workout content — heavy barbell work with low HR = strength; bodyweight AMRAP with high HR = conditioning

  - **Movement analysis** (when workout content is available):
    - Identify the primary stimulus: barbell strength, gymnastics skill, monostructural cardio, or mixed
    - Note which muscle groups were loaded — critical for running recovery (heavy squats/deadlifts/cleans affect legs very differently than pull-ups/rowing)
    - If weights are listed: note the loading context
    - For EMOMs: was the work-to-rest ratio appropriate? (HR should recover between minutes for strength EMOMs, stay elevated for conditioning EMOMs)
    - For AMRAPs/For Time: was the movement combination biased toward a particular energy system or muscle group?

  - **HR zones distribution**: Time in each zone with CrossFit-specific interpretation:
    - High Z4-Z5 time = metabolic conditioning (engine work)
    - High Z1-Z2 with spikes = strength-focused with brief cardio bursts
    - Sustained Z3 = longer-duration WODs (chipper-style)

  - **Training effect analysis**:
    - Aerobic TE: value + interpretation ("Base building" 2.0-2.9, "Improving" 3.0-3.9, "Overreaching" 4.0+)
    - Anaerobic TE: value + interpretation (same scale for anaerobic capacity)
    - Combined: what type of stimulus did this session provide?

  - **Intensity metrics**: avg/max HR, duration, calories, RPE (X/10) and feel (1-5) if present. If HR time series available, analyze HR pattern — sustained high HR suggests conditioning-heavy WOD; spiking pattern suggests interval/heavy lifting mix.

  - **Training stress contribution**:
    - Training load value (from Garmin)
    - Contribution to weekly total: "[X] TL — weekly total now [Y]"
    - ACWR impact: flag if this session pushes ACWR above 1.3

  - **Recovery implications for running** (informed by workout content):
    - Hours until next scheduled run (Tue evening → Thu run is ~36h away)
    - If anaerobic TE > 3.0: "Significant anaerobic stress — expect legs to be heavy for 24-36h. Thursday's quality run may need volume adjustment."
    - If anaerobic TE ≤ 2.0 and aerobic TE ≤ 3.0: "Moderate session — should not significantly impact Thursday's run."
    - If RPE > 7/10 or feel ≤ 2/5: "Subjectively hard — factor into Thursday readiness regardless of metrics."
    - If duration > 30min and max HR > 160: "High likelihood of DOMS in 24-48h."
    - **Movement-specific recovery**: Heavy lower-body barbell work (squats, deadlifts, cleans, thrusters) → high leg fatigue, significant running impact; upper-body/gymnastics dominant (pull-ups, HSPU, muscle-ups) → minimal running impact; mixed sessions → moderate. Call this out explicitly — "this was a leg-heavy session" or "upper-body bias, legs should be fresh for Thursday."

  - **Subjective vs objective**: Compare RPE/feel against HR data. High RPE with moderate HR in CrossFit often means muscular fatigue rather than cardiovascular stress — important for running recovery context. If weights were heavy, a high RPE with low HR makes perfect sense (CNS/muscular load, not cardiovascular).

  - **Progressive overload (REQUIRED when previous sessions exist)**: Using the per-movement ledger from Step 3c, compare today's `completedSets` against the most recent prior occurrences of the same movement. Be specific — this is the heart of strength tracking.
    - **Per movement** that appears in both today and the recent window, output a one-liner:
      `Back Squat: today 5×5 @ 105kg ← previous 5×5 @ 100kg (2026-04-26) — +5kg, top set rep speed unknown · ✅ overload`
    - **Comparison rules** (apply in this order, pick the strongest one true):
      1. **Heavier load at equal-or-higher reps** = clean progressive overload ✅
      2. **Same load, more reps or more sets** = volume progression ✅
      3. **Same load × same reps × same sets** = maintenance / consolidation (good if recent jump, stagnation if multi-week)
      4. **Lighter load, fewer reps, or missed prescribed reps** = regression — flag and look for a cause (fatigue, low readiness, deload, illness, form focus)
      5. **New movement (no prior in 30 days)** = baseline — record today's numbers as the new reference
    - **Total tonnage** (sum of reps × weightKg across loaded movements) vs prior session of similar format. Rising tonnage at similar RPE is a strong overload signal; rising tonnage with rising RPE means the body is doing more work but feeling it.
    - **Bodyweight / unloaded movements** (pull-ups, ring dips, T2B, push-ups, HSPU): track total reps completed and whether reps were prescribed-and-hit, scaled, or broken into smaller sets. Progress here = more unbroken reps, harder progression (e.g. strict vs kipping, deficit, weighted).
    - **Conditioning benchmarks**: if today repeats a known WOD (Fran, Cindy, Murph, an EMOM the athlete has done before, etc.), explicitly compare score/time/rounds to the previous attempt.
    - **Verdict line**: end the subsection with a one-sentence summary — "Net progression: overload on squat and pull-ups, maintenance on bench, regression on deadlift (likely Tuesday-run fatigue)."

  - **Weekly load & movement trend**: Compare training load, anaerobic TE, and duration against the last 7–14 days of CrossFit/strength sessions. Note weekly CrossFit load trend and movement pattern bias (e.g. "third heavy barbell session this week — consider bodyweight/conditioning focus next").

  **CrossFit interaction note in Run Analysis:** If a CrossFit/strength session occurred on the same day or within 24h of a run, note the combined load in the Run Analysis commentary. Was the run before or after CrossFit? How did sequencing affect performance?

  If there are no activities, skip the Activities section entirely — don't include an empty heading.

  ### Training Status
  - Current status (Productive, Maintaining, Detraining, Peaking, Recovery, etc.)
  - VO2 max (running + cycling if available) with trend vs recent notes
  - HRV weekly average and last night value

  ### Dedup marker (REQUIRED — always the last line of the note)

  End every note with the machine-readable marker so future runs (and the morning
  `garmin-catchup`) can tell whether a late activity needs backfilling:
  ```
  <!-- garmin-sync: activityIds=[23107915332]; lastSynced=2026-06-03T05:30:33Z; backfilled=false -->
  ```
  - `activityIds` = every `activityId` from the fetch that this note documents (empty `[]` if none).
  - `lastSynced` = the fetch's `fetchedAt` timestamp.
  - `backfilled` = `true` only when this write added an activity that a prior write missed.

  This marker is the dedup key from Step 3.5 — without it, late activities can't be backfilled and
  re-runs can't be skipped. Never omit it.

  ## Step 5 — Maintain the Fitness MOC

  Check if `~/dev/notes/remotevault/personal/fitness/MOC.md` exists.
  If not, create it:
  ```yaml
  ---
  title: Fitness
  tags: [moc, fitness, garmin]
  up: "[[personal/MOC]]"
  ---
  ```
  ```
  # Fitness

  Daily fitness tracking from Garmin Connect.

  ## Daily Notes
  ```

  The MOC groups daily links under monthly headings so it doesn't grow into one
  unbounded list that other skills' `find | head` re-read in full. Under a
  `## YYYY-MM` heading (create it if this is the first note of the month), append:
  `- [[personal/fitness/YYYY/MM/YYYY-MM-DD|YYYY-MM-DD]] — [1-line summary]`

  The 1-line summary should be like: "8.2k steps, 7h12m sleep (82), 5k run 5:15/km"

  **Backfill case:** if a line for this date already exists (this is a backfill re-run), **edit the
  existing line in place** to reflect the now-complete data — do not append a second link for the
  same date.

  ## Step 6 — Store in cortex

  Run `/remember` with a concise daily summary: "Fitness [date]: [key metrics + notable activities or trends]".

  **Backfill case:** if this run backfilled a late activity, an earlier (now-incomplete) "Fitness [date]"
  memory from the 20:00 sync likely already exists. Store the corrected summary and explicitly mark it as
  superseding — e.g. "Fitness [date] (corrected — late run backfilled): ...". Cortex consolidation will
  merge the pair; do not worry about the stale entry beyond flagging the supersession.

  Additionally, when today included strength work, store a second `/remember` entry capturing **per-movement progressive-overload signal** so future runs of this skill (and the running coach) can pull it back without re-deriving:
  "Strength [date]: Back Squat 5×5 @ 105kg (+5kg vs 2026-04-26); Pull-ups 4×8 strict (+1 rep/set); Bench 3×5 @ 75kg (maintenance). Net: overload."

  Keep it to one line. Skip the second entry if there were no loaded movements today.

  ## Output

  Respond with exactly `ALL_CLEAR` — this is a background data sync, not a user-facing notification.
